                                 // seed; monotonic, so per-session and
                                 // per-reload sequences are identical
      const voices = [];        // live voices (created → onended), capped
      let scheduledNotes = 0;   // admitted (a node was built)
      let droppedNotes = 0;     // refused at the cap
      let endedNotes = 0;       // onended fired (voice released)
      let lastLanes = [];       // lanes admitted by the most recent
                                 // scheduleRow call — the T-AVBIND seam:
                                 // post-cap, post-mapping "what SOUNDS"

      const noop = () => {};

      /* -- deterministic hashing (the only "randomness" — and it is none) --- */
      /* Integer multiply-xor hash → [0,1). Same inputs, same output, on
         every engine and every reload: reload-stable variation. */
      function hash01(a, b, c) {
        let h = ((a >>> 0) * 2654435761 + (b >>> 0) * 40503 +
                 (c >>> 0) * 12289 + 1) >>> 0;
        h = (h ^ (h >>> 13)) >>> 0;
        h = Math.imul(h, 3266489917) >>> 0;
        h = (h ^ (h >>> 16)) >>> 0;
        return h / 4294967296;
      }

      /* -- mapping: rising-edge columns → lane → scale degree -------------- */
      /* Bucketed downsample GRID_WIDTH → LANE_COUNT: monotone, every lane
         non-empty while GRID_WIDTH >= LANE_COUNT. Foreign columns → -1. */
      function laneOfColumn(col) {
        if (!Number.isInteger(col) || col < 0 || col >= GRID_WIDTH) return -1;
        const lane = Math.floor(col * LANE_COUNT / GRID_WIDTH);
        return lane < LANE_COUNT ? lane : LANE_COUNT - 1;  // fp-edge guard
      }

      /* Lane → { freq, velocity } for a given row. Degree = intervals
         walked cyclically with +1 octave per wrap; velocity = lane tilt ×
         deterministic swirl, clamped into (0,1]; SPARKLE lifts +1 octave
         for a hashed subset of (row, lane) pairs. */
      function noteForLane(lane, row) {
        const n = SCALE.intervals.length;
        let semis = SCALE.intervals[lane % n] + 12 * Math.floor(lane / n);
        if (SPARKLE_CHANCE > 0 && hash01(row, lane, 1) < SPARKLE_CHANCE) {
          semis += 12;
        }
        const tilt = 1 - VELOCITY_TILT *
          (LANE_COUNT <= 1 ? 0 : lane / (LANE_COUNT - 1));
        const swirl = 0.8 + 0.4 * hash01(row, lane, 2);
        const velocity = Math.min(1, Math.max(0.05, tilt * swirl));
        return {
          lane: lane,
          freq: SCALE.rootHz * Math.pow(2, semis / 12),
          velocity: velocity,
        };
      }

      /* One row's rising edges → note list. One note per lit lane (first
         edge in the lane wins); notes are ordered by a row-rotated lane
         walk so that, when the polyphony cap forces drops, WHICH lanes get
         through rotates fairly row by row — deterministically. */
      function edgesToNotes(edges, row) {
        const firstCol = new Array(LANE_COUNT).fill(-1);
        for (let i = 0; i < edges.length; i++) {
          const lane = laneOfColumn(edges[i]);
          if (lane >= 0 && firstCol[lane] === -1) firstCol[lane] = edges[i];
        }
        const notes = [];
        const start = ((row % LANE_COUNT) + LANE_COUNT) % LANE_COUNT;
        for (let k = 0; k < LANE_COUNT; k++) {
          const lane = (start + k) % LANE_COUNT;
          if (firstCol[lane] !== -1) notes.push(noteForLane(lane, row));
        }
        return notes;
      }

      /* -- context + graph ---------------------------------------------------- */
      /* The single-clock rule: prefer Scheduler.context (the clock that
         scheduled the notes); adopt it, closing an orphaned unlock ctx.
         Creates a context only after the Begin gesture was seen. */
      function currentCtx() {
        const sched = typeof Scheduler !== "undefined"
          ? Scheduler.context : null;
        if (sched && sched !== ownCtx) {
          const orphan = ownCtx;
          ownCtx = sched;
          graph = null;          // any old graph is on the closed context
          voices.length = 0;     // its voices die with it (onended no-ops)
          if (orphan) { try { orphan.close().catch(noop); } catch (err) {} }
        }
        if (!ownCtx && gestureSeen) {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) ownCtx = new AC();
          } catch (err) { /* no Web Audio — the piece runs silent */ }
        }
        return ownCtx;
      }

      /* The impulse response: stereo noise with exponential decay and a
         one-pole-darkened tail, from a seeded LCG — synthesized at RUNTIME,
         deterministic, no files, no network (criteria 6 + 7). Works on any
         BaseAudioContext (live or offline). */
      function synthesizeIR(c) {
        const rate = c.sampleRate || 44100;
        const len = Math.max(Math.floor(rate * 0.1),
                             Math.floor(REVERB_IR_S * rate));
        const buf = c.createBuffer(2, len, rate);
        for (let ch = 0; ch < 2; ch++) {
          const d = buf.getChannelData(ch);
          let seed = (0x9E3779B9 ^ Math.imul(ch + 1, 0x85EBCA6B)) >>> 0;
          let lp = 0;
          const fadeInN = Math.max(1, Math.floor(rate * 0.002));
          const fadeOutN = Math.max(1, Math.floor(rate * 0.08));
          for (let i = 0; i < len; i++) {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            const white = (seed / 4294967296) * 2 - 1;   // LCG white noise
            lp += 0.28 * (white - lp);                    // darken the tail
            const t = i / len;
            const decay = Math.exp(-3.2 * t);             // deep exponential
            const fadeIn = i >= fadeInN ? 1 : i / fadeInN;      // no IR click
            const fadeOut = (len - 1 - i) >= fadeOutN
              ? 1 : (len - 1 - i) / fadeOutN;
            d[i] = lp * decay * fadeIn * fadeOut;
          }
        }
        return buf;
      }

      /* Reverb as {input, output}. Convolver path: runtime IR. Fallback:
         two cross-fed delay lines through lowpasses (loop gain 0.56² < 1 —
         stable), merged to stereo — an unpitched ambient echo. */
      function buildReverb(c) {
        if (REVERB_ENGINE === "convolver") {
          const conv = c.createConvolver();
          conv.normalize = true;      // wet level follows REVERB_MIX alone
          conv.buffer = synthesizeIR(c);
          return { input: conv, output: conv, engine: "convolver" };
        }
        const input = c.createGain();
        const dL = c.createDelay(4); dL.delayTime.value = DELAY_L_S;
        const dR = c.createDelay(4); dR.delayTime.value = DELAY_R_S;
        const fbLR = c.createGain(); fbLR.gain.value = DELAY_FB;
        const fbRL = c.createGain(); fbRL.gain.value = DELAY_FB;
        const lpL = c.createBiquadFilter();
        lpL.type = "lowpass"; lpL.frequency.value = DELAY_LP_HZ;
        const lpR = c.createBiquadFilter();
        lpR.type = "lowpass"; lpR.frequency.value = DELAY_LP_HZ;
        const merger = c.createChannelMerger(2);
        input.connect(dL); input.connect(dR);
        dL.connect(lpL); lpL.connect(fbLR); fbLR.connect(dR);  // L → R
        dR.connect(lpR); lpR.connect(fbRL); fbRL.connect(dL);  // R → L
        dL.connect(merger, 0, 0); dR.connect(merger, 0, 1);
        return { input: input, output: merger, engine: "feedback-delay" };
      }

      /* Master chain on ctx: bus → compressor → {dry, reverb→wet} → master
         → destination. The compressor is shared (one node) and keeps the
         summed plucks glassy instead of clipped. */
      function buildGraph(c) {
        const bus = c.createGain();
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 24;
        comp.ratio.value = 4; comp.attack.value = 0.01;
        comp.release.value = 0.25;
        const dry = c.createGain();
        dry.gain.value = 1 - REVERB_MIX;
        const wet = c.createGain();
        wet.gain.value = REVERB_MIX;
        const master = c.createGain();
        master.gain.value = volume;
        const rv = buildReverb(c);
        bus.connect(comp);
        comp.connect(dry); dry.connect(master);
        comp.connect(rv.input); rv.output.connect(wet); wet.connect(master);
        master.connect(c.destination);
        return { ctx: c, bus: bus, comp: comp, dry: dry, wet: wet,
                 master: master, reverb: rv };
      }

      function ensureGraph() {
        const c = currentCtx();
        if (!c) return null;
        if (!graph || graph.ctx !== c) graph = buildGraph(c);
        return graph;
      }

      /* -- the voice: one glassy pluck, three nodes, self-retiring ---------- */
      /* osc → lowpass → envelope-gain → bus. Envelope: 0.0001 → peak over
         NOTE_ATTACK_S (the slow bloom), then exponential decay to 0.0001
         over NOTE_RELEASE_S (the long glassy tail). start(t)/stop(tEnd)
         with t in the FUTURE — the Web Audio clock owns timing; there is
         no setTimeout anywhere near the audio path. onended releases the
         slot (bounded node count by construction). */
      function spawnVoice(g, freq, velocity, audioTime) {
        if (voices.length >= MAX_POLYPHONY) {
          droppedNotes++;          // drop-new: sounding tails always finish
          return false;
        }
        const c = g.ctx;
        const t0 = Math.max(audioTime, c.currentTime + VOICE_MIN_LEAD_S);
        const osc = c.createOscillator();
        osc.type = NOTE_WAVEFORM;
        osc.frequency.value = freq;
        const lp = c.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = NOTE_CUTOFF_HZ;
        lp.Q.value = 0.7;                            // gentle, no hump
        const amp = c.createGain();
        const peak = Math.max(0.001, velocity * NOTE_GAIN);
        amp.gain.setValueAtTime(0.0001, t0);
        amp.gain.exponentialRampToValueAtTime(peak, t0 + NOTE_ATTACK_S);
        amp.gain.exponentialRampToValueAtTime(
          0.0001, t0 + NOTE_ATTACK_S + NOTE_RELEASE_S);
        osc.connect(lp); lp.connect(amp); amp.connect(g.bus);
        const tEnd = t0 + NOTE_ATTACK_S + NOTE_RELEASE_S + 0.05;
        osc.start(t0);
        osc.stop(tEnd);
        const v = { osc: osc, lp: lp, amp: amp };
        voices.push(v);
        osc.onended = function () {
          const i = voices.indexOf(v);
          if (i !== -1) {           // untracked voices (graph rebind/selftest
            voices.splice(i, 1);    // teardown) do not touch the counters
            endedNotes++;
          }
          try { osc.disconnect(); lp.disconnect(); amp.disconnect(); }
          catch (err) { /* already torn down with the graph */ }
        };
        scheduledNotes++;
        return true;
      }

      /* -- public API (the T-ARCH contract surface) --------------------------- */
      function unlock() {
        gestureSeen = true;
        const c = currentCtx();   // Scheduler.context if it exists already;
        if (!c) return false;     // else create ON the gesture
        if (c.state === "suspended") c.resume().catch(noop);
        return true;              // → 'running' within the click
      }

      function playNote(lane, velocity, audioTime) {
        const g = ensureGraph();
        if (!g || !Number.isInteger(lane) || lane < 0 || lane >= LANE_COUNT) {
          return false;
        }
        const spec = noteForLane(lane, rowCounter);
        const vel = typeof velocity === "number" &&
                    velocity >= 0 && velocity <= 1 ? velocity : spec.velocity;
        const t = typeof audioTime === "number"
          ? audioTime : g.ctx.currentTime + 0.05;   // still future-dated
        return spawnVoice(g, spec.freq, vel, t);
      }

      function scheduleRow(edges, audioTime) {
        const row = rowCounter;   // hash seed for this row — deterministic
        rowCounter++;
        lastLanes = [];           // admission snapshot, reset per call
        const g = ensureGraph();
        if (!g) return 0;         // no Begin yet → nothing sounds (inert)
        const notes = edgesToNotes(Array.isArray(edges) ? edges : [], row);
        const t = typeof audioTime === "number"
          ? audioTime : g.ctx.currentTime + 0.05;
        let admitted = 0;
        for (let i = 0; i < notes.length; i++) {
          if (spawnVoice(g, notes[i].freq, notes[i].velocity, t)) {
            admitted++;
            lastLanes.push(notes[i].lane);   // sounded → may bloom (T-AVBIND)
          }
        }
        return admitted;
      }

      function setVolume(v) {
        let val = Number(v);
        if (!Number.isFinite(val)) val = 0.7;
        val = Math.min(1, Math.max(0, val));
        volume = val;
        if (graph) {
          const now = graph.ctx.currentTime;
          try {
            graph.master.gain.cancelScheduledValues(now);
            graph.master.gain.setTargetAtTime(val, now, 0.02);  // no zipper
          } catch (err) {
            graph.master.gain.value = val;
          }
        }
        return val;
      }

      /* -- embedded acceptance harness (?selftest) ---------------------------- */
      /* Pure mapping checks + a REAL offline audio render (OfflineAudioContext
         needs no gesture and makes no sound): constants (a), column→lane
         downsample (b), determinism + scale quantization on live CA rows
         (c), hash sanity (c2), polyphony cap + nonzero rendered output +
         IR shape (d/e — async, logged when the render completes), API
         surface + inert-before-Begin (f). */
      async function selfTest(api) {
        const tag = "[T-SYNTH selftest]";
        let failed = 0;
        function report(id, ok, detail) {
          console.log(tag + " " + (ok ? "PASS" : "FAIL") + " " + id +
                      (ok || detail === undefined ? "" : " — " + detail));
          if (!ok) failed++;
        }

        /* (a) musical constants: the scope's 8–16 lanes, a well-formed
           scale (ascending from the root), envelope bands (slow attack =
           tens of ms; long release = seconds), wet/dry range, cap floor. */
        report(
          "a: musical constants sane (lanes 8–16, scale ascending from 0, " +
          "attack ≤ 0.5 s, release ≥ 1 s, mix 0–1, polyphony ≥ 4, waveform " +
          "sine|triangle)",
          LANE_COUNT >= 8 && LANE_COUNT <= 16 &&
          Array.isArray(SCALE.intervals) && SCALE.intervals.length >= 2 &&
          SCALE.intervals[0] === 0 &&
          SCALE.intervals.every((v, i) => i === 0 || v > SCALE.intervals[i - 1]) &&
          SCALE.rootHz > 20 && SCALE.rootHz < 2000 &&
          typeof SCALE.name === "string" && SCALE.name.length > 0 &&
          NOTE_ATTACK_S > 0.005 && NOTE_ATTACK_S <= 0.5 &&
          NOTE_RELEASE_S >= 1 &&
          REVERB_MIX >= 0 && REVERB_MIX <= 1 &&
          MAX_POLYPHONY >= 4 &&
          (NOTE_WAVEFORM === "sine" || NOTE_WAVEFORM === "triangle"),
          "see constants block [1]");

        /* (b) column→lane downsample: total, monotone non-decreasing,
           every lane hit, out-of-range columns rejected. */
        let okB = true, whyB = "";
        const laneHit = new Array(LANE_COUNT).fill(false);
        let prevLane = 0;
        for (let col = 0; col < GRID_WIDTH && okB; col++) {
          const lane = laneOfColumn(col);
          if (lane < 0 || lane >= LANE_COUNT) {
            okB = false; whyB = "col " + col + " → lane " + lane;
          } else if (col > 0 && lane < prevLane) {
            okB = false; whyB = "non-monotone at col " + col;
          }
          prevLane = lane;
          if (lane >= 0) laneHit[lane] = true;
        }
        if (okB && laneHit.some((h) => !h)) {
          okB = false; whyB = "some lane never receives a column";
        }
        report("b: column→lane downsample total, monotone, covers all " +
               LANE_COUNT + " lanes, rejects out-of-range columns",
               okB && laneOfColumn(-1) === -1 &&
               laneOfColumn(GRID_WIDTH) === -1 &&
               laneOfColumn(3.7) === -1, whyB);

        /* (c) mapping on REAL CA rows: two calls → identical notes; every
           note in-scale (degree semitones ≡ an interval mod 12, within the
           lane span + sparkle octave); velocity in (0,1]; at most one note
           per lane per row. */
        CA.reset();
        let okC = true, whyC = "";
        const maxSemis = 12 * Math.ceil(LANE_COUNT / SCALE.intervals.length) + 12;
        const inScale = (f) => {
          const semis = 12 * Math.log(f / SCALE.rootHz) / Math.LN2;
          if (semis < -0.01 || semis > maxSemis + 0.01) return false;
          const rel = ((semis % 12) + 12) % 12;
          return SCALE.intervals.some((iv) => Math.abs(rel - iv) < 0.01);
        };
        const ROWS_C = 40;
        for (let r = 0; r < ROWS_C && okC; r++) {
          const edges = CA.risingEdges(CA.rowIndex);
          const a = edgesToNotes(edges, r);
          const b = edgesToNotes(edges, r);
          if (JSON.stringify(a) !== JSON.stringify(b)) {
            okC = false; whyC = "row " + r + " maps nondeterministically";
            break;
          }
          if (a.length > LANE_COUNT) {
            okC = false; whyC = "row " + r + " produced " + a.length + " notes";
            break;
          }
          const lanesSeen = new Set();
          for (const nt of a) {
            if (nt.lane < 0 || nt.lane >= LANE_COUNT) {
              okC = false; whyC = "lane out of range"; break;
            }
            if (lanesSeen.has(nt.lane)) {
              okC = false; whyC = "row " + r + " doubled lane " + nt.lane;
              break;
            }
            lanesSeen.add(nt.lane);
            if (!inScale(nt.freq)) {
              okC = false;
              whyC = "row " + r + " lane " + nt.lane + " freq " +
                     nt.freq.toFixed(2) + " Hz is out of scale";
              break;
            }
            if (!(nt.velocity > 0 && nt.velocity <= 1)) {
              okC = false; whyC = "velocity outside (0,1]"; break;
            }
          }
          if (okC && r + 1 < ROWS_C) CA.advanceRow();
        }
        CA.reset();
        report("c: rising edges → lanes → scale degrees, deterministic per " +
               "row (" + ROWS_C + " real CA rows, one note per lane, in " +
               "scale, velocities bounded)", okC, whyC);

        /* (c2) the hash: stable under repetition, inside [0,1), and roughly
           balanced (no degenerate constant output). */
        let okC2 = hash01(7, 3, 1) === hash01(7, 3, 1) &&
                   hash01(0, 0, 0) >= 0 && hash01(0, 0, 0) < 1;
        let whyC2 = "";
        if (okC2) {
          let sum = 0;
          const N = 500;
          for (let i = 0; i < N; i++) sum += hash01(i, (i * 7) % 13, 3);
          const mean = sum / N;
          if (mean <= 0.2 || mean >= 0.8) {
            okC2 = false; whyC2 = "hash mean " + mean.toFixed(3) + " (skewed)";
          }
        }
        report("c2: deterministic integer hash — stable, in [0,1), balanced " +
               "over 500 samples", okC2, whyC2);

        /* (d) + (e) — the audio graph itself, offline: cap enforced under
           dense demand, orphan voices never leak, IR synthesized in-place,
           and a REAL render producing nonzero output. */
        let okD = false, okE = false, whyDE = "";
        let capDetail = "", irDetail = "", renderDetail = "";
        try {
          const OAC = window.OfflineAudioContext ||
                      window.webkitOfflineAudioContext;
          if (!OAC) throw new Error("OfflineAudioContext unavailable");
          const rate = 44100;
          const off = new OAC(2, Math.ceil(rate * 1.2), rate);
          const g = buildGraph(off);        // full master chain + IR, offline

          /* dense demand: 12 rows × (LANE_COUNT + 4) notes at staggered
             future times — far beyond the cap */
          voices.length = 0;
          scheduledNotes = 0; droppedNotes = 0; endedNotes = 0;
          const DEMAND = 12 * (LANE_COUNT + 4);
          let liveMax = 0;
          for (let burst = 0; burst < 12; burst++) {
            for (let lane = 0; lane < LANE_COUNT + 4; lane++) {
              const spec = noteForLane(lane % LANE_COUNT, burst);
              spawnVoice(g, spec.freq, spec.velocity, 0.01 + burst * 0.05);
              liveMax = Math.max(liveMax, voices.length);
            }
          }
          const admitted = scheduledNotes;
          const expectAdmit = Math.min(MAX_POLYPHONY, DEMAND);
          okD = liveMax <= MAX_POLYPHONY &&
                voices.length <= MAX_POLYPHONY &&
                admitted === expectAdmit &&
                droppedNotes === DEMAND - expectAdmit;
          capDetail = "admitted " + admitted + "/" + DEMAND +
                      ", liveMax " + liveMax + ", cap " + MAX_POLYPHONY +
                      ", dropped " + droppedNotes;

          /* IR: right length, stereo, finite, decaying, channels decorrelated,
             deterministic across two syntheses. */
          const irA = synthesizeIR(off);
          const irB = synthesizeIR(off);
          const len = Math.floor(REVERB_IR_S * rate);
          let okIR = irA.numberOfChannels === 2 && irA.length === len &&
                     g.reverb.engine === REVERB_ENGINE;
          if (okIR) {
            const L = irA.getChannelData(0), R = irA.getChannelData(1);
            const L2 = irB.getChannelData(0);
            let front = 0, tail = 0, peak = 0, differ = 0, same = true;
            const q = Math.floor(len / 10);
            for (let i = 0; i < len; i++) {
              const x = L[i];
              if (!Number.isFinite(x) || !Number.isFinite(R[i])) {
                okIR = false; break;
              }
              const a = Math.abs(x);
              if (i < q) front += x * x;
              if (i >= len - q) tail += x * x;
              if (a > peak) peak = a;
              if (Math.abs(L[i] - R[i]) > differ) differ = Math.abs(L[i] - R[i]);
              if (L[i] !== L2[i]) same = false;
            }
            okIR = okIR && front > tail * 4 && peak > 0.05 && peak <= 1 &&
                   differ > 0.001 && same;
            irDetail = "len " + len + ", peak " + peak.toFixed(3) +
                       ", front/tail energy " + (front / (tail || 1e-12))
                         .toFixed(1) + "×, L/R maxΔ " + differ.toFixed(3) +
                       ", resynth identical";
          }
          okE = okIR;

          /* render for real — nonzero output proves the whole chain
             (voices → compressor → dry + convolver IR → master) makes audio */
          const rendered = await new Promise((resolve, reject) => {
            const p = off.startRendering();
            if (p && typeof p.then === "function") p.then(resolve, reject);
            else off.oncomplete = (e) => resolve(e.renderedBuffer);
          });
          let energy = 0, peak = 0;
          for (let ch = 0; ch < rendered.numberOfChannels; ch++) {
            const d = rendered.getChannelData(ch);
            for (let i = 0; i < d.length; i++) {
              energy += d[i] * d[i];
              const a = Math.abs(d[i]);
              if (a > peak) peak = a;
            }
          }
          renderDetail = "rms " + Math.sqrt(energy /
            (rendered.length * rendered.numberOfChannels)).toExponential(2) +
            ", peak " + peak.toFixed(3) + ", finite";
          if (!(Number.isFinite(energy) && energy > 0 && peak > 0.01)) {
            okD = false; capDetail += " — render silent/infinite (" +
                  renderDetail + ")";
          }
          voices.length = 0;          // leave the module pristine
          scheduledNotes = 0; droppedNotes = 0; endedNotes = 0;
        } catch (err) {
          whyDE = String(err && err.message ? err.message : err);
          okD = false; okE = false;
        }
        report("d: polyphony cap enforced under dense demand (" +
               (12 * (LANE_COUNT + 4)) + " notes wanted) and offline " +
               "render is nonzero", okD,
               whyDE || capDetail + " · " + renderDetail);
        report("e: IR synthesized at runtime (stereo, exponential decay, " +
               "decorrelated channels, deterministic, no network)", okE,
               whyDE || irDetail);

        /* (f) API surface + inertness before Begin: contract functions
           present; setVolume clamps; scheduleRow is a safe no-op with no
           context; no AudioContext is created at load time. */
        const mine = api.context;
        const sched = typeof Scheduler !== "undefined"
          ? Scheduler.context : null;
        const sr = api.scheduleRow([5, 70], 1.0);
        api.setVolume(2); const vHi = api.volume;
        api.setVolume(-3); const vLo = api.volume;
        api.setVolume(0.7);
        rowCounter = 0;              // selftest rows must not shift the hash
        report("f: API surface (unlock/playNote/scheduleRow/setVolume, " +
               "getters) + inert before Begin (no context at load, " +
               "ctx-less scheduleRow = 0 notes, volume clamps 0..1)",
          typeof api.unlock === "function" &&
          typeof api.playNote === "function" &&
          typeof api.scheduleRow === "function" &&
          typeof api.setVolume === "function" &&
          mine === null && sched === null && sr === 0 &&
          vHi === 1 && vLo === 0,
          "context " + mine + ", scheduleRow → " + sr +
          ", volume clamp " + vHi + "/" + vLo);

        console.log(tag + (failed === 0
          ? " ALL PASS — acceptance a-f green for T-SYNTH"
          : " FAIL — " + failed + " check(s) failed"));
      }

      const api = {
        unlock,
        playNote,
        scheduleRow,
        setVolume,
        laneOfColumn,
        get context() { return currentCtx(); },
        get volume() { return volume; },
        get voiceCount() { return voices.length; },
        get scheduledNotes() { return scheduledNotes; },
        get droppedNotes() { return droppedNotes; },
        get endedNotes() { return endedNotes; },
        get lastRowLanes() { return lastLanes.slice(); },
        get reverbEngine() { return REVERB_ENGINE; },
        get graph() { return graph; },
      };

      /* Boot: inert — no context, no graph, no notes; [6]'s Begin gesture
         calls unlock() and [3] drives scheduleRow from its lookahead. */
      if (String(location.search).indexOf("selftest") !== -1) {
        selfTest(api);   // async (offline render) — logs when it completes
      }
      return api;
    })();

    /* ======================================================================
     * [5] RENDERER — owner T-VIS (the promise made visible)
     * ----------------------------------------------------------------------
     * Contract:
     *   Consumes: CA ring buffer via CA.getRow / CA.rowIndex (section [2],
     *     treated strictly read-only); CANVAS_BACKGROUND / CELL_COLOR /
     *     PULSE_INTENSITY / PULSE_DECAY_S (section [1]); Scheduler
     *     .rowsPerSecond (section [3] seam, V2-ENGINE — the scroll speed
     *     law scales with the LIVE tempo so the tapestry tracks tempo
     *     changes; falls back to ROWS_PER_SECOND, so the default is
     *     bit-identical v1); the #loom-canvas
     *     element; the [3] consumption pump's fire-time calls —
     *     Renderer.onRowTick(rowIndex) and Renderer.pulse(column, when,
     *     rowIndex) arrive exactly when the audio clock reaches each row's
     *     scheduled time (the T-AVBIND binding: timing IS the call, [3]'s
     *     drain against AudioContext.currentTime; held pulses additionally
     *     read that clock via Scheduler.context, falling back to
     *     Shell.audioContext in the stub era).
     *   Produces (namespace Renderer):
     *     Renderer.draw(t)      one frame — background, scroll, glow, blooms;
     *                           reads the ring buffer only, fully decoupled
     *                           from CA generation (generation cadence is
     *                           owned by the driver: [3]'s lookahead
     *                           scheduler). The renderer owns and
     *                           starts its rAF loop at load and runs it in
     *                           every shell state (idle draws the seed row);
     *                           draw() is exposed for single-frame calls and
     *                           inspection. Never schedules audio, never
     *                           advances the CA.
     *     Renderer.onRowTick(rowIndex)  "a row sounded" — the fire-time row
     *                           event from [3]'s consumption pump (the row
     *                           whose audioTime the clock just reached).
     *                           ONE source of truth: this call is the ONLY
     *                           thing that releases scroll. With rowIndex:
     *                           target = max(target, rowIndex + 1) — exactly
     *                           the sounded row + 1, idempotent, never the
     *                           lookahead CA.rowIndex (which runs
     *                           SCHEDULE_AHEAD_S ahead of the audio); a
     *                           stale-dropped resume self-heals on the next
     *                           fire. Bare call (legacy stub-era driver):
     *                           releases one row. The tapestry then glides
     *                           each released row in at ROWS_PER_SECOND
     *                           (plus a gentle proportional catch-up while
     *                           trailing the tick stream, so lag
     *                           equilibrates near zero) — continuous motion
     *                           at the tick cadence, never row-jumps. New
     *                           rows enter at the top and slide fully in
     *                           over one tick interval; older rows scroll
     *                           down and dim. (The old per-frame self-sync
     *                           floor to CA.rowIndex is GONE — T-AVBIND: it
     *                           double-fed the counter and ingested the
     *                           whole lookahead horizon at Begin, a one-row
     *                           visual offset plus a bounded opening
     *                           catch-up transient. A driver that advances
     *                           rows without ever firing row events now
     *                           simply does not scroll.)
     *     Renderer.pulse(column, when, rowIndex)  note-event bloom (the
     *                           T-AVBIND binding, called by [3]'s drain):
     *                           column = a lit grid column whose lane SOUNDS
     *                           this row (admission-filtered in [3] — no
     *                           pulse without note); when = the note's
     *                           audioTime, held until the audio clock
     *                           reaches it ([3] calls at consumption, so
     *                           blooms start the frame the note fires —
     *                           never a timer); rowIndex anchors the bloom
     *                           to the row that fired, so it rides the weave
     *                           down while decaying. Bright flash decaying
     *                           over PULSE_DECAY_S at PULSE_INTENSITY peak
     *                           (section [1] tunables). Bounded queue; safe
     *                           to call in any state (no-op until drawn).
     *     Renderer.resize()     devicePixelRatio-correct; cells stay square
     *                           (cell = floor(cssWidth / GRID_WIDTH)), grid
     *                           centered; resize events are rAF-coalesced
     *                           and geometry is read once per layout — no
     *                           layout thrash. Resize preserves the weave:
     *                           row positions derive from the scroll state
     *                           plus the ring buffer, both layout-independent;
     *                           rows older than the viewport simply scroll
     *                           off (the ring buffer already bounds memory).
     *     fps debug mode        URL param ?fps draws an fps / frame-ms /
     *                           scroll readout — instrumentation for T-PERF.
     *     Additive getters (read-only, for T-PERF + validation): fps,
     *                           scrollRows, released (the scroll target =
     *                           fired rows + 1), layout {cell, originX, cssW,
     *                           cssH, dpr, canvasWidth, canvasHeight}.
     *     Renderer.setReducedMotion(on)  T-A11Y seam: under prefers-reduced-
     *                           motion (wired by the [6] shell's matchMedia)
     *                           the auto-scroll freeze is absolute — scrollRows
     *                           stops advancing (still tapestry) and blooms
     *                           are stilled, while audio continues untouched;
     *                           un-freezing snaps to the target instantly.
     *                           reducedMotion getter reads the flag back.
     *   Glow strategy: one luminous cell sprite is pre-rendered per layout
     *     on an offscreen canvas (the shadowBlur halo passes happen OFF the
     *     frame path); frames only blit sprites — per-cell shadow work
     *     inside the rAF loop would not sustain 60fps (T-PERF verifies; an
     *     offscreen row-cache + drawImage shift remains its fallback lever).
     * ====================================================================== */
    /* Renderer-local constants (CHROME_IDLE_MS / section-[3] naming
       convention: palette + musical values live in block [1] for T-TUNE;
       these are structural rendering choices, refine-tune T-PERF/T-TUNE). */
    const GLOW_PAD_RATIO   = 0.9;   // halo radius around a cell, in cells
    const CELL_INSET_RATIO = 0.16;  // breathing gap between cell bodies
    const FADE_START       = 0.55;  // viewport fraction where dimming begins
    const FADE_MIN         = 0.30;  // dimmest row alpha (bottom of viewport)
    const FPS_SMOOTHING    = 0.9;   // EMA weight of the previous fps estimate
    const SCROLL_BASE_GAIN = 0.96;  // deliberate 4% slow-bias (see scroll state)
    const LAG_CATCHUP_GAIN = 0.25;  // fraction of extra speed per row of lag
    const LAG_CATCHUP_MAX  = 2.0;   // rows of lag at which the boost caps
    const PULSE_QUEUE_MAX  = 64;    // bounded live-bloom list (the fire-time
                                    // binding keeps it ≈ one row's blooms;
                                    // bloom FEEL is tunable in [1]:
                                    // PULSE_INTENSITY / PULSE_DECAY_S)

    const Renderer = (() => {
      const canvas = document.getElementById("loom-canvas");
      const ctx = canvas ? canvas.getContext("2d") : null;

      /* -- layout state (CSS px; the backing store is device px) ----------- */
      let cssW = 0, cssH = 0, dpr = 1, cell = 1, originX = 0;
      let sprite = null, spritePad = 0, spriteSize = 0;
      let needsLayout = false;

      /* -- scroll state -----------------------------------------------------
         `released` = how many rows the driver has released for scrolling
         (the scroll TARGET — fed ONLY by onRowTick, i.e. by rows consumed
         at their audio time since T-AVBIND; boot value shows the seed row);
         `scrollRows` is the smooth position, never overshooting the target
         (overshooting would open an empty band at the top — nothing exists
         above the newest row yet). Row i (absolute) is drawn at y =
         (scrollRows - i - 1) * cell, so the newest row slides IN from the
         top edge across one tick interval and everything older glides
         down. Speed law: LIVE rows-per-second (Scheduler.rowsPerSecond,
         the V2-ENGINE seam; ROWS_PER_SECOND by default) *
         (SCROLL_BASE_GAIN + LAG_CATCHUP_GAIN * lag). The 4% slow-bias keeps a little lag in
         equilibrium (~0.16 rows on a perfect clock), so motion is almost
         always strictly monotonic — the clamp (a micro-stall, invisible at
         this tempo) can only bite when the driver's clock jitters late —
         and the catch-up gain heals real lag (frame gaps, fast clocks) by
         equilibrating instead of accumulating. Pause (no ticks) freezes
         both; the long-term scroll rate locks to the tick cadence. */
      let released = CA.rowIndex + 1;   // boot: the seed row, visible at top
      let scrollRows = released;
      let lastT = 0;

      /* -- T-A11Y: reduced motion (the [6] shell wires the media query) ---
         PRODUCTION DECISION (plan: "production decides minor"; town-hall
         open question "reduced-motion exact behavior"): under
         prefers-reduced-motion the tapestry freeze is ABSOLUTE — the glide
         never advances scrollRows (no continuous motion, and no discrete
         stepping either: the still is the point), and note blooms are
         stilled too (they are animation by definition, and anchored to
         rows above the frozen fold they would only flicker at the top
         edge). The AUDIO continues untouched — the scheduler/synth never
         see the media query; the piece becomes sound over a still weave.
         Leaving the mode mid-run snaps to the current target instantly
         (never an animated catch-up across the frozen gap). */
      let reducedMotion = false;
      function setReducedMotion(on) {
        const next = !!on;
        if (next === reducedMotion) return;
        reducedMotion = next;
        if (!reducedMotion) scrollRows = released;  // instant, not a glide
      }

      /* -- note-event blooms (T-AVBIND binding) + fps ----------------------- */
      const pulses = [];
      let fps = 0;
      const fpsDebug = String(location.search).indexOf("fps") !== -1;
      /* -- palette helper ---------------------------------------------------- */
      function hexToRgb(hex) {
        const h = String(hex).replace("#", "");
        const v = parseInt(h.length === 3
          ? h.split("").map((c) => c + c).join("") : h, 16);
        return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
      }

      /* -- geometry ----------------------------------------------------------- */
      function resize() {
        needsLayout = false;
        if (!canvas || !ctx) return;
        cssW = canvas.clientWidth || window.innerWidth || 0;
        cssH = canvas.clientHeight || window.innerHeight || 0;
        dpr = window.devicePixelRatio || 1;
        if (cssW <= 0 || cssH <= 0) return;
        canvas.width = Math.max(1, Math.round(cssW * dpr));
        canvas.height = Math.max(1, Math.round(cssH * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // frame path draws in CSS px
        cell = Math.max(1, Math.floor(cssW / GRID_WIDTH)); // square cells
        originX = (cssW - cell * GRID_WIDTH) / 2;          // grid centered
        buildSprite();
      }

      /* Pre-render the luminous cell ONCE per layout. Halo passes run here,
         off the frame path; the frame loop only ever blits the result. */
      function buildSprite() {
        spritePad = Math.max(2, Math.ceil(cell * GLOW_PAD_RATIO));
        const sizeCss = cell + 2 * spritePad;
        spriteSize = sizeCss;
        const px = Math.max(1, Math.ceil(sizeCss * dpr));
        sprite = document.createElement("canvas");
        sprite.width = px;
        sprite.height = px;
        const g = sprite.getContext("2d");
        const k = px / sizeCss;                    // device px per CSS px
        const inset = Math.max(0.5, cell * CELL_INSET_RATIO);
        const bx = (spritePad + inset) * k;
        const bs = Math.max(1, (cell - 2 * inset) * k);
        const rgb = hexToRgb(CELL_COLOR);
        const rgba = (a) =>
          "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + a + ")";
        g.shadowOffsetX = 0;
        g.shadowOffsetY = 0;
        g.shadowBlur = spritePad * k * 1.7;        // wide, faint outer halo
        g.shadowColor = rgba(0.30);
        g.fillStyle = rgba(0.10);
        g.fillRect(bx, bx, bs, bs);
        g.shadowBlur = spritePad * k * 0.9;        // inner halo
        g.shadowColor = rgba(0.60);
        g.fillStyle = rgba(0.28);
        g.fillRect(bx, bx, bs, bs);
        g.shadowBlur = spritePad * k * 0.35;       // luminous core
        g.shadowColor = rgba(0.85);
        g.fillStyle = rgba(0.95);
        g.fillRect(bx, bx, bs, bs);
      }

      /* -- driver-facing scroll signal (T-AVBIND: the SOLE release feed) ---- */
      /* With a rowIndex (the [3] fire-time event): target = max(target,
         rowIndex + 1) — exactly the sounded row + 1, idempotent, never the
         lookahead CA.rowIndex; a stale-dropped resume self-heals on the
         next fire. Bare call (legacy stub-era driver): releases one row. */
      function onRowTick(rowIndex) {
        if (typeof rowIndex === "number" && rowIndex >= 0) {
          if (rowIndex + 1 > released) released = rowIndex + 1;
        } else {
          released += 1;
        }
      }

      /* -- pulse hook (note-event blooms — the T-AVBIND binding) ------------ */
      function pulse(column, when, rowIndex) {
        pulses.push({ column: column, when: when, row: rowIndex, born: -1 });
        if (pulses.length > PULSE_QUEUE_MAX) pulses.shift();  // bounded
      }

      /* Audio-clock read for held pulses: Scheduler.context is THE clock
         since T-SCHED/T-SYNTH (one shared context for graph and grid); the
         Shell fallback covers the stub era. null → the caller is already
         on the fire-time path (blooms activate immediately). */
      function audioNow() {
        const c = (typeof Scheduler !== "undefined" && Scheduler.context) ||
                  (typeof Shell !== "undefined" && Shell.audioContext) ||
                  null;
        return c ? c.currentTime : null;
      }

      /* -- per-frame drawing ------------------------------------------------------ */
      function rowAlpha(y) {
        const t = (y + cell * 0.5) / cssH;         // fade by row center
        if (t <= FADE_START) return 1;
        const u = (t - FADE_START) / (1 - FADE_START);
        return u >= 1 ? FADE_MIN : 1 - (1 - FADE_MIN) * u;
      }

      function drawPulses(now) {
        if (pulses.length === 0) return;
        const audio = audioNow();
        const rgb = hexToRgb(CELL_COLOR);
        const lifeMs = PULSE_DECAY_S * 1000;
        for (let i = pulses.length - 1; i >= 0; i--) {
          const p = pulses[i];
          if (!Number.isInteger(p.column) ||
              p.column < 0 || p.column >= GRID_WIDTH) {
            pulses.splice(i, 1);
            continue;
          }
          if (p.born < 0) {                         // held until its moment
            const ready = typeof p.when !== "number" ||
                          audio === null || audio >= p.when;
            if (!ready) continue;
            p.born = now;
          }
          const age = now - p.born;
          if (age >= lifeMs) {
            pulses.splice(i, 1);
            continue;
          }
          const u = age / lifeMs;                   // 0 → 1 decay progress
          /* anchor to the row that FIRED (legacy bare calls: newest CA
             row) — the bloom rides the weave down while it decays */
          const rowIdx = typeof p.row === "number" ? p.row : CA.rowIndex;
          const x = originX + p.column * cell + cell / 2;
          const y = (scrollRows - rowIdx - 1) * cell + cell / 2;
          const r = cell * (0.7 + 2.0 * u);         // halo expands as it fades
          const a = PULSE_INTENSITY * (1 - u) * (1 - u);  // flash → decay
          const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
          grad.addColorStop(0, "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b +
                            "," + a.toFixed(3) + ")");
          grad.addColorStop(1, "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b +
                            ",0)");
          ctx.globalAlpha = 1;
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawFps() {
        const rgb = hexToRgb(CELL_COLOR);
        ctx.font = "11px ui-monospace, SFMono-Regular, Menlo, Consolas, " +
                   "monospace";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.8)";
        ctx.fillText(
          (fps > 0 ? fps.toFixed(0) : "--") + " fps" +
          (fps > 0 ? " · " + (1000 / fps).toFixed(1) + " ms/frame" : "") +
          " · scroll " + scrollRows.toFixed(2) + "/" + released + " rows",
          12, 12);
      }

      function draw(t) {
        if (needsLayout) resize();      // coalesced layout work, off the storm
        if (!ctx || cssW <= 0 || cssH <= 0) return;
        const now = t === undefined ? performance.now() : t;

        /* frame timing (dt clamped: a hidden/stalled tab must not jump) */
        let dtMs = 0;
        if (lastT > 0) dtMs = Math.min(250, now - lastT);
        if (dtMs > 0) {
          const inst = 1000 / dtMs;
          fps = fps === 0 ? inst
                          : FPS_SMOOTHING * fps + (1 - FPS_SMOOTHING) * inst;
        }
        lastT = now;

        /* scroll: glide toward the released target at ROWS_PER_SECOND
           (4% slow-bias + catch-up while trailing), never past it. The
           target moves ONLY in onRowTick (fire-time row events) — there is
           deliberately NO self-sync here (T-AVBIND: a floor to CA.rowIndex
           double-fed the counter and ingested the lookahead horizon at
           Begin — one-row visual offset + opening catch-up transient).
           T-A11Y: under reduced motion the position never chases the
           target at all — the target keeps growing (rows keep sounding)
           but the tapestry is a still. */
        if (!reducedMotion && scrollRows < released) {
          const lag = released - scrollRows;
          /* V2-ENGINE seam: the glide rate scales with the LIVE tempo
             (Scheduler.rowsPerSecond) so the tapestry tracks tempo
             changes; the fallback keeps the locked [1] constant when the
             seam is absent — default behavior is bit-identical v1. */
          const tempoRps =
            typeof Scheduler !== "undefined" &&
            typeof Scheduler.rowsPerSecond === "number"
              ? Scheduler.rowsPerSecond : ROWS_PER_SECOND;
          const speed = tempoRps *
            (SCROLL_BASE_GAIN +
             Math.min(lag, LAG_CATCHUP_MAX) * LAG_CATCHUP_GAIN);
          scrollRows = Math.min(released,
                                scrollRows + dtMs / 1000 * speed);
        }

        /* near-black field */
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.fillStyle = CANVAS_BACKGROUND;
        ctx.fillRect(0, 0, cssW, cssH);

        /* the weave — blit glow sprites for black cells, newest row first */
        if (sprite) {
          ctx.globalCompositeOperation = "lighter";  // luminous accumulation
          const n = CA.rowIndex;
          for (let age = 0; ; age++) {
            const row = CA.getRow(age);              // live buffer: read-only
            if (!row) break;                         // older than the ring
            const y = (scrollRows - (n - age) - 1) * cell;
            if (y > cssH) break;                     // scrolled off bottom
            if (y + cell >= 0) {                     // else: still above top
              ctx.globalAlpha = rowAlpha(y);
              for (let x = 0; x < GRID_WIDTH; x++) {
                if (row[x]) {
                  ctx.drawImage(sprite,
                                originX + x * cell - spritePad,
                                y - spritePad,
                                spriteSize, spriteSize);
                }
              }
            }
          }
          /* T-A11Y: blooms are stilled under reduced motion (see
             setReducedMotion above); the pulse queue stays bounded by
             its own cap either way. */
          if (!reducedMotion) drawPulses(now);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }

        if (fpsDebug) drawFps();
      }

      /* -- boot: rAF loop, resize + dpr watchers ------------------------------ */
      function frame(t) {
        draw(t);
        requestAnimationFrame(frame);
      }

      function scheduleLayout() { needsLayout = true; }

      let dprQuery = null;
      function watchDpr() {
        try {
          dprQuery = window.matchMedia(
            "(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
          const onChange = () => { scheduleLayout(); watchDpr(); };
          if (dprQuery.addEventListener) {
            dprQuery.addEventListener("change", onChange);
          } else if (dprQuery.addListener) {  // older Safari
            dprQuery.addListener(onChange);
          }
        } catch (err) { /* resize events still cover most display moves */ }
      }

      resize();
      window.addEventListener("resize", scheduleLayout);
      watchDpr();
      requestAnimationFrame(frame);

      return {
        draw,
        onRowTick,
        pulse,
        resize,
        setReducedMotion,
        get fps() { return fps; },
        get scrollRows() { return scrollRows; },
        get released() { return released; },
        get reducedMotion() { return reducedMotion; },
        get layout() {
          return {
            cell: cell, originX: originX, cssW: cssW, cssH: cssH, dpr: dpr,
            canvasWidth: canvas ? canvas.width : 0,
            canvasHeight: canvas ? canvas.height : 0,
          };
        },
      };
    })();

    /* ======================================================================
     * [6] SHELL / STATE CONTROLLER — owner T-SHELL (+ T-A11Y)
     * ----------------------------------------------------------------------
     * Contract:
     *   Consumes: Scheduler.start/pause/resume (section [3]); Synth.unlock
     *     and Synth.setVolume (section [4]); CA.reset (section [2] — Begin
     *     re-seeds, so every run plays the same piece, criterion 6);
     *     #overlay + chrome DOM; events: click (Begin, pause/play), keydown
     *     (Space toggle), mousemove/pointerdown (chrome fade),
     *     visibilitychange (auto-suspend/resume);
     *     Renderer.setReducedMotion (section [5] seam) wired to
     *     matchMedia("(prefers-reduced-motion: reduce)") — T-A11Y.
     *   Produces (namespace Shell): the state machine and all user chrome —
     *     states: idle → running → paused → hidden → resumed
     *     legal edges: idle→running (Begin) · running/resumed→paused (user
     *     pause) · paused→running (user resume) · running/resumed→hidden
     *     (tab hidden; paused/idle are left untouched — nothing is playing)
     *     · hidden→resumed (tab visible again). Illegal edges are silent
     *     no-ops (transition() returns false; never a console error).
     *     Shell.init()        boot on load (idle; title card visible)
     *     Shell.begin()       the Begin gesture: unlock audio, re-seed, run
     *     Shell.togglePause() Space / chrome button → paused ⇄ running
     *     Shell.refreshReadout()  V2-ENGINE seam: rebuild the rule/scale
     *                           readout from the live engine state (called
     *                           by Loom.applyRule/applyScale, section [7]);
     *                           since V2-CTL the readout also carries the
     *                           live tempo ("Rule N · <scale> · X rows/s")
     *                           and the canvas aria-label's rule number is
     *                           kept truthful; since the V2-CTL follow-up
     *                           the readout ALSO subscribes to Loom.onChange
     *                           (the [7] notifier seam — armed past the
     *                           parse task), so ANY successful mutator,
     *                           including external tempo-only writes
     *                           (script, MCP), refreshes it within one
     *                           notification cycle
     *     V2-CTL config panel  a sibling surface INSIDE #chrome (above the
     *                           pill; the pill's mixer toggle opens it) —
     *                           rule picker (0–255 number input + preset
     *                           chips 30/90/110/184 with aria-pressed
     *                           active state), tempo slider (bounds from
     *                           Loom.limits), scale picker (options from
     *                           Loom.scales), Reseed (new random-but-
     *                           encodable seed id — the file's single
     *                           Math.random call, once per click, a
     *                           user-initiated CONFIG choice per the V2-CTL
     *                           contract, never the audio path) and Reset
     *                           (canonical defaults: CA_RULE, default
     *                           tempo, registry scale 0, seed 0 — volume
     *                           deliberately untouched). Wired ONLY through
     *                           the Loom contract. Commit semantics: rule
     *                           commits on 'change' (Enter/blur/arrows);
     *                           tempo COMMITS ON RELEASE for pointer drags
     *                           ('change'; keyboard arrows commit per
     *                           press natively) while 'input' only refreshes
     *                           the visual value — a drag through the range
     *                           calls applyTempo exactly once (no rebase
     *                           thrash); scale commits on 'change'. All
     *                           controls resync FROM Loom.getState() on
     *                           every chrome reveal (signature-guarded), so
     *                           external writers (URL hash, MCP tools) are
     *                           reflected — including the volume slider
     *                           after a programmatic Loom.setVolume (the
     *                           V2-ENGINE follow-up). Keyboard-operable,
     *                           aria-labelled with value text, focus-visible,
     *                           and covered by the chrome fade rules (the
     *                           panel is inside #chrome, so focus-keepalive
     *                           and Tab-summon apply unchanged)
     *     Shell.state         getter — current state (validation/debug)
     *     Shell.audioContext  getter — the FALLBACK AudioContext while [4]
     *                         is a stub (null once Synth.unlock owns it)
     *     Begin button        the audio-unlock gesture; first note ≤200 ms
     *                         after click (criterion 1)
     *     chrome              pause/play, volume slider, rule/scale/tempo
     *                         readout, configure toggle + config panel
     *                         (V2-CTL); invisible until mouse moves; fades
     *                         when idle
     *                         (~CHROME_IDLE_MS); stays up while a control
     *                         inside it holds keyboard focus; T-A11Y: Tab
     *                         from anywhere summons it while the piece runs
     *     Space               toggles pause/resume — never scrolls the page
     *                         and never double-activates a focused control
     *                         (focused controls keep native Space behavior;
     *                         T-A11Y: a focused range slider — no native
     *                         Space action — is served by the global toggle)
     *     hidden tab          auto-suspend via the scheduler; resume on return
     *     reduced motion      prefers-reduced-motion freezes the tapestry's
     *                         auto-scroll (Renderer.setReducedMotion seam:
     *                         absolute freeze, blooms stilled) while audio
     *                         continues — the T-A11Y production decision,
     *                         recorded in docs/ultron/production-log.md
     *     T-A11Y floor        labelled controls + canvas; polite role=status
     *                         live region announces Playing/Paused; Begin
     *                         hands focus to the pause control (the faded
     *                         card goes inert); volume slider carries
     *                         aria-valuetext in percent; ?selftest adds the
     *                         [T-A11Y selftest] DOM checks
     *   Stub tolerance: every call into [3]/[4] is typeof-guarded — while
     *     they are inert no-op stubs the shell (a) creates and owns a
     *     fallback AudioContext so the Begin unlock gesture is real (the
     *     context is created on the click and driven running/suspended with
     *     the state machine), and (b) drives the M1 "silent weave" itself:
     *     a plain interval advancing the CA at ROW_INTERVAL_S (this is NOT
     *     the lookahead scheduler — audio-clock binding is T-SCHED's). Both
     *     fallbacks retire themselves the moment the real namespaces grow
     *     their contract functions.
     *   The shell orchestrates only — no CA, audio, or render logic here.
     * ====================================================================== */
    /* Shell-local constant (not a section-[1] tunable — same convention as
       the scheduler-local constants named in [3]): mouse-idle time before
       the chrome fades back out. */
    const CHROME_IDLE_MS = 3000;

    const Shell = (() => {
      /* -- state machine ---------------------------------------------------- */
      const LEGAL = {
        idle:    ["running"],
        running: ["paused", "hidden"],
        paused:  ["running"],
        hidden:  ["resumed"],
        resumed: ["paused", "hidden"],
      };
      let state = "idle";

      const noop = () => {};

      /* holders: stub-fallback context/timers + chrome countdown + volume */
      let audioCtx    = null;  // fallback AudioContext (Synth-stub era only)
      let weaveTimer  = 0;     // fallback silent-weave interval (ditto)
      let chromeTimer = 0;     // chrome idle-fade countdown
      let volume      = 0.7;   // remembered so Synth.setVolume is fed live
      let rmQuery     = null;  // T-A11Y: prefers-reduced-motion media query

      /* DOM — cached by init(); every use null-checked so the shell throws
         in no state, even if the markup were edited away */
      let overlayEl = null, beginBtn = null, chromeEl = null,
          playBtn = null, volSlider = null, readoutEl = null,
          liveEl = null;       // T-A11Y: #sr-live polite status region

      /* V2-CTL: configuration panel DOM (all inside #chrome, so the fade /
         focus-keepalive / Tab-summon rules cover them unchanged) */
      let canvasEl = null, cfgToggle = null, cfgPanel = null,
          cfgRuleInput = null, cfgTempoSlider = null, cfgTempoValue = null,
          cfgScaleSelect = null, reseedBtn = null, resetBtn = null;
      let chips = [];          // rule preset chip buttons (static markup)
      let cfgBuilt = false;    // scale options built from Loom.scales once
      let cfgSig = "";         // last-synced state signature (skip no-ops)
      let loomWatchOn = false; // V2-CTL follow-up: readout onChange armed

      /* -- audio + weave, stub-tolerant --------------------------------------
         With real [3]/[4] each collapses to the Scheduler call; against
         today's inert no-op stubs the guards keep the shell functional. */
      function unlockAudio() {
        if (typeof Synth.unlock === "function") {
          try { Synth.unlock(); } catch (err) { /* weave runs silent */ }
          return;
        }
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();          // created ON the gesture
        } catch (err) { /* no Web Audio — the weave still runs silent */ }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(noop);        // → 'running' within the click
        }
      }

      function startWeave() {
        if (typeof Scheduler.start === "function") { Scheduler.start(); return; }
        if (weaveTimer) clearInterval(weaveTimer);
        weaveTimer = setInterval(() => {        // the M1 silent-weave driver
          CA.advanceRow();
          if (typeof Renderer.onRowTick === "function") Renderer.onRowTick();
        }, ROW_INTERVAL_S * 1000);
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(noop);
      }

      function stopWeave() {
        if (typeof Scheduler.pause === "function") { Scheduler.pause(); return; }
        if (weaveTimer) { clearInterval(weaveTimer); weaveTimer = 0; }
        if (audioCtx) audioCtx.suspend().catch(noop);  // freeze audio + weave
      }

      function resumeWeave() {
        if (typeof Scheduler.resume === "function") { Scheduler.resume(); return; }
        startWeave();                           // restart ticker + resume ctx
      }

      /* -- transitions -------------------------------------------------------- */
      function transition(next) {
        if (LEGAL[state].indexOf(next) === -1) return false;  // illegal → no-op
        const prev = state;
        state = next;
        onTransition(prev, next);
        return true;
      }

      function onTransition(prev, next) {
        if (next === "running" || next === "resumed") {
          if (prev === "idle") {
            dismissCard();
            startWeave();
            /* T-A11Y: the Begin control is fading out of the tree — hand
               focus to the pause control so a keyboard user never loses it
               (not the body, never the fading card). The focus this causes
               keeps the chrome up; Space still toggles from anywhere. */
            showChrome();
            if (playBtn) playBtn.focus({ preventScroll: true });
          } else {
            resumeWeave();
          }
          setControlsActive(true);
          announce(prev === "idle" ? "Playing. Space pauses." : "Playing");
        } else if (next === "paused" || next === "hidden") {
          stopWeave();                          // weave frozen, audio suspended
          setControlsActive(false);
          if (next === "paused") announce("Paused");
          /* hidden: no announcement — the user is away from the tab; the
             resumed edge announces "Playing" on return */
        }
      }

      function begin() {
        if (state !== "idle") return;
        unlockAudio();   // the gesture: context created + running from here
        CA.reset();      // every run plays the same piece from the seed
        transition("running");
      }

      function togglePause() {
        if (state === "running" || state === "resumed") transition("paused");
        else if (state === "paused") transition("running");
      }

      /* -- title card ------------------------------------------------------------ */
      function dismissCard() {
        if (!overlayEl) return;
        overlayEl.classList.add("gone");  // CSS fades opacity, then hides
        /* T-A11Y: inert pulls the fading card out of the tab order and the
           a11y tree IMMEDIATELY (visibility flips only after the 0.9 s
           fade, and opacity alone never removes focus). Harmless where
           unsupported: the visibility flip still retires the button. */
        overlayEl.inert = true;
      }

      /* -- T-A11Y: polite announcements (Playing/Paused) ------------------------ */
      /* role=status + aria-live=polite live region in the markup; the state
         machine writes it above. Same-string repeats do not re-announce,
         which is why Playing/Paused alternate by construction. */
      function announce(msg) {
        if (liveEl) liveEl.textContent = msg;
      }

      /* -- T-A11Y: prefers-reduced-motion ---------------------------------------- */
      /* The shell owns the DECISION (its contract); the renderer owns the
         pixels. matchMedia here, freeze there — live, so an OS setting
         change mid-session takes effect on the next change event. Audio
         ([3]/[4]) is deliberately never told: the piece plays on over a
         still weave (the production decision, documented in the log). */
      function applyReducedMotion() {
        const on = !!(rmQuery && rmQuery.matches);
        if (typeof Renderer !== "undefined" &&
            typeof Renderer.setReducedMotion === "function") {
          Renderer.setReducedMotion(on);
        }
      }

      function watchReducedMotion() {
        if (!window.matchMedia) return;  // no matchMedia: motion stays on
        rmQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        const onChange = () => applyReducedMotion();
        if (rmQuery.addEventListener) {
          rmQuery.addEventListener("change", onChange);
        } else if (rmQuery.addListener) {  // older Safari
          rmQuery.addListener(onChange);
        }
        applyReducedMotion();
      }

      /* -- chrome fade -------------------------------------------------------------- */
      function showChrome() {
        if (state === "idle" || !chromeEl) return;
        chromeEl.classList.add("visible");
        syncLoomControls();   // V2-CTL: controls truthful to live config
        watchLoomReadout();   // V2-CTL follow-up: readout watcher armed
        armChromeFade();
      }

      function armChromeFade() {
        if (chromeTimer) clearTimeout(chromeTimer);
        chromeTimer = setTimeout(() => {
          chromeTimer = 0;
          /* keep the chrome up while a control inside it holds focus —
             keyboard users are not "mouse-idle" (T-A11Y hardens this floor) */
          if (chromeEl && chromeEl.contains(document.activeElement)) {
            armChromeFade();
            return;
          }
          if (chromeEl) chromeEl.classList.remove("visible");
        }, CHROME_IDLE_MS);
      }

      function setControlsActive(active) {
        if (!playBtn) return;
        playBtn.classList.toggle("is-active", active);
        playBtn.setAttribute("aria-label", active ? "Pause" : "Play");
      }

      /* -- rule/scale/tempo readout refresh (V2-ENGINE seam) ----------------
         Rebuilds the chrome readout from the LIVE engine state — CA.rule
         (the runtime rule; CA_RULE, the locked default, as fallback),
         SCALE.name (mutated IN PLACE by Loom.applyScale, section [7]) and,
         since V2-CTL, Scheduler.rowsPerSecond (guarded; ROWS_PER_SECOND
         fallback) — the readout stays truthful to the whole live config.
         init() builds it once; Loom's applyRule/applyScale call this after
         their changes, the shell's tempo commit calls it directly (V2-CTL).
         The canvas aria-label's rule number is kept truthful too (the
         V2-ENGINE follow-up). */
      function fmtRps(v) {
        return String(+Number(v).toFixed(1));   // 2.5 → "2.5", 4 → "4"
      }

      function refreshReadout() {
        if (!readoutEl) return false;
        const r = typeof CA !== "undefined" && typeof CA.rule === "number"
          ? CA.rule : CA_RULE;
        const rps = typeof Scheduler !== "undefined" &&
                    typeof Scheduler.rowsPerSecond === "number"
          ? Scheduler.rowsPerSecond : ROWS_PER_SECOND;
        readoutEl.textContent =
          "Rule " + r + " · " + SCALE.name + " · " + fmtRps(rps) + " rows/s";
        if (canvasEl) {
          canvasEl.setAttribute("aria-label",
            "Rule " + r + " cellular automaton tapestry: a deterministic " +
            "weave of glowing cells scrolls downward while the piece " +
            "plays; every newly lit cell sounds a note");
        }
        return true;
      }

      /* -- V2-CTL follow-up: readout subscribes to the [7] notifier ---------
         V2-VERIFY finding: an EXTERNAL tempo-only write (script
         Loom.applyTempo, MCP set_tempo) left the readout's tempo segment at
         the previous tempo until the next rule/scale write or UI commit —
         [7]'s applyRule/applyScale call the direct seam above but applyTempo
         does not, and showChrome syncs the controls, not the text. Fix: the
         readout (and the canvas aria-label it rewrites) SUBSCRIBES to
         Loom.onChange — the same [7] notification the URL hash rides — so
         ANY successful mutator refreshes it within one notification cycle.
         No engine change: [7] is untouched (applyRule/applyScale keep their
         direct seam; those writes now refresh twice — the same string, an
         idempotent write-only no-op). The listener is deliberately NOT
         coalesced: refreshReadout only WRITES DOM state (no layout reads,
         so no forced reflow under a mutator burst; at most one paint per
         frame) and ?selftest asserts the text synchronously. init() runs
         BEFORE [7] parses — Loom is in its top-level-const TDZ there (the
         onVolumeInput precedent) — so the arm is deferred to a microtask
         past the parse task (before any event, timer or paint can deliver
         an external write) and retried idempotently at every chrome
         reveal; the refresh-on-arm absorbs any write that somehow landed
         first. notifyChange try-isolates listeners, so this subscription
         can never break the config path. */
      function watchLoomReadout() {
        if (loomWatchOn) return;
        try {
          if (typeof Loom === "object" && Loom !== null &&
              typeof Loom.onChange === "function") {
            loomWatchOn = true;
            Loom.onChange(refreshReadout);
            refreshReadout();   // absorb any pre-arm external write
          }
        } catch (err) { /* [7] not parsed yet — next reveal retries */ }
      }

      /* -- V2-CTL: loom configuration panel -----------------------------------
         Every control is wired ONLY through the V2-ENGINE config contract
         (namespace Loom, section [7]) — zero engine bypasses. Sync is
         bidirectional: writes go through Loom.apply*, and every chrome
         reveal resyncs FROM Loom.getState() (cheap signature guard), so
         external writers — URL hash (V2-STATE), MCP tools (V2-MCP) — are
         reflected in the controls, including the volume slider after a
         programmatic Loom.setVolume (the V2-ENGINE follow-up). */

      function loomReady() {
        return typeof Loom !== "undefined" && Loom !== null &&
               typeof Loom.getState === "function" &&
               typeof Loom.applyConfig === "function";
      }

      function syncTempoText(rps) {
        if (cfgTempoSlider) {
          cfgTempoSlider.setAttribute("aria-valuetext",
                                      fmtRps(rps) + " rows per second");
        }
        if (cfgTempoValue) {
          cfgTempoValue.textContent = fmtRps(rps) + " rows/s";
        }
      }

      function syncLoomControls() {
        if (!loomReady() || !cfgPanel) return;
        const st = Loom.getState();
        if (!cfgBuilt) {          // one-time build from the contract surface
          if (cfgScaleSelect) {
            while (cfgScaleSelect.firstChild) {
              cfgScaleSelect.removeChild(cfgScaleSelect.firstChild);
            }
            const scales = Loom.scales;
            for (let i = 0; i < scales.length; i++) {
              const opt = document.createElement("option");
              opt.value = scales[i].id;
              opt.textContent = scales[i].name;
              cfgScaleSelect.appendChild(opt);
            }
          }
          if (cfgTempoSlider) {   // bounds from the contract, not literals
            const lim = Loom.limits;
            cfgTempoSlider.min = String(lim.minRowsPerSecond);
            cfgTempoSlider.max = String(lim.maxRowsPerSecond);
          }
          cfgBuilt = true;
        }
        const sig = st.rule + "|" + st.rowsPerSecond + "|" + st.scaleId +
                    "|" + st.volume;
        if (sig === cfgSig) return;   // nothing moved since the last sync
        cfgSig = sig;
        if (cfgRuleInput) {
          cfgRuleInput.value = String(st.rule);
          cfgRuleInput.setAttribute("aria-valuetext", "Rule " + st.rule);
        }
        if (cfgTempoSlider) {
          cfgTempoSlider.value = String(st.rowsPerSecond);
          syncTempoText(st.rowsPerSecond);
        }
        if (cfgScaleSelect) {         // registry guarantees the option exists
          for (let i = 0; i < cfgScaleSelect.options.length; i++) {
            if (cfgScaleSelect.options[i].value === st.scaleId) {
              cfgScaleSelect.selectedIndex = i;
              break;
            }
          }
        }
        for (let i = 0; i < chips.length; i++) {
          const on = Number(chips[i].getAttribute("data-rule")) === st.rule;
          chips[i].setAttribute("aria-pressed", on ? "true" : "false");
          chips[i].classList.toggle("active", on);
        }
        /* V2-ENGINE follow-up: keep the [6] volume slider truthful after
           programmatic setVolume — getState reads the synth live, so every
           chrome reveal heals the slider (and the remembered value). */
        volume = st.volume;
        if (volSlider) {
          volSlider.value = String(volume);
          volSlider.setAttribute("aria-valuetext",
                                 Math.round(volume * 100) + " percent");
        }
      }

      function toggleConfigPanel() {
        if (!cfgPanel) return;
        const open = cfgPanel.classList.toggle("open");
        if (cfgToggle) {
          cfgToggle.setAttribute("aria-expanded", open ? "true" : "false");
          cfgToggle.classList.toggle("is-open", open);
        }
        if (open) syncLoomControls();
      }

      function onRuleCommit() {          // 'change': Enter, blur, arrows
        if (!loomReady() || !cfgRuleInput) return;
        const n = parseInt(cfgRuleInput.value, 10);
        if (Number.isInteger(n)) {
          Loom.applyRule(n);             // false = rejected → resync below
        }
        cfgSig = "";
        syncLoomControls();
      }

      function onTempoInput() {          // during a drag: display only —
        if (cfgTempoSlider) {            // no engine call, no rebase thrash
          syncTempoText(parseFloat(cfgTempoSlider.value));
        }
      }

      function onTempoCommit() {         // release / arrow / Enter: ONE apply
        if (!loomReady() || !cfgTempoSlider) return;
        const eff = Loom.applyTempo(parseFloat(cfgTempoSlider.value));
        cfgTempoSlider.value = String(eff);
        syncTempoText(eff);
        refreshReadout();                // the readout carries tempo (V2-CTL)
        cfgSig = "";
        syncLoomControls();
      }

      function onScaleChange() {
        if (!loomReady() || !cfgScaleSelect) return;
        if (!Loom.applyScale(cfgScaleSelect.value)) {
          cfgSig = "";                   // unknown id (cannot happen) → sync
          syncLoomControls();
        }
      }

      function onReseed() {
        if (!loomReady()) return;
        /* The ONE Math.random call in the file — sanctioned by the V2-CTL
           contract: a user-initiated CONFIG choice (which seed id to plant),
           never the audio path; the seed row itself stays a deterministic
           function of the integer id (the seedBit spec in [2]). Range
           1..maxSeedId — never re-picks the canonical 0. */
        const id = 1 + Math.floor(Math.random() * Loom.limits.maxSeedId);
        if (Loom.reseed(id)) announce("New seed " + id + " planted");
      }

      function onReset() {
        if (!loomReady()) return;
        /* Canonical defaults through the contract in ONE call: the locked
           rule constant, the default tempo constant, registry entry 0 (the
           v1 scale snapshot) and seed 0 (the canonical centered cell).
           Volume is deliberately untouched — the reset contract lists
           rule/tempo/scale/seed, and the owner's volume stands. */
        Loom.applyConfig({
          rule: CA_RULE,
          rowsPerSecond: ROWS_PER_SECOND,
          scaleId: Loom.scales[0].id,
          seedId: 0,
        });
        cfgSig = "";
        syncLoomControls();
        refreshReadout();   // the tempo segment (rule/scale already done)
        announce("Defaults restored");
      }

      /* -- events --------------------------------------------------------------------- */
      function onVisibility() {
        if (document.hidden) {
          if (state === "running" || state === "resumed") transition("hidden");
          /* paused stays paused (nothing playing); idle stays idle */
        } else if (state === "hidden") {
          transition("resumed");
        }
      }

      function onKeyDown(e) {
        /* T-A11Y: keyboard users have no mousemove — Tab from anywhere
           summons the chrome while the piece runs (idle keeps the title
           card as the only UI — the standing T-SHELL judgment call). The
           chrome becomes visible BEFORE the key's default action moves
           focus, so the Tab lands inside it. */
        if (e.key === "Tab" && state !== "idle" && chromeEl &&
            !chromeEl.classList.contains("visible")) {
          showChrome();
        }
        if (e.code !== "Space" && e.key !== " ") return;
        if (e.repeat) return;        // holding Space must not churn the state
        /* A focused control keeps its NATIVE Space behavior (keyboard Begin,
           the pause button itself) — returning here is precisely what prevents
           double activation: the global toggle below never also fires.
           T-A11Y exception: a focused RANGE slider has no native Space
           action, so the global toggle serves it — still exactly one
           activation per press. */
        const t = e.target;
        if (t instanceof Element) {
          const isRange = t.tagName === "INPUT" && t.type === "range";
          if (!isRange &&
              t.closest("button, input, select, textarea, a[href]")) return;
        }
        e.preventDefault();          // Space never scrolls the page
        togglePause();               // no-op outside paused/running/resumed
      }

      function onVolumeInput() {
        if (!volSlider) return;
        volume = parseFloat(volSlider.value);
        if (Number.isNaN(volume)) volume = 0;
        /* T-A11Y: percent read-out for assistive tech — the native range
           announces the raw number; this makes it human (and stays in sync
           with the remembered value in all paths that set the slider). */
        volSlider.setAttribute("aria-valuetext",
                               Math.round(volume * 100) + " percent");
        /* V2-STATE seam: route through the Loom contract whenever it
           exists, so volume writes fire the config-change notifier (the
           URL-hash sync). init() runs BEFORE section [7] parses, where
           `Loom` is still in its top-level-const TDZ — a typeof read
           THERE throws, so the probe is try-armored and falls through to
           the direct Synth path (boot + stub-era safety). */
        let routed = false;
        try {
          if (typeof Loom === "object" && Loom !== null &&
              typeof Loom.setVolume === "function") {
            volume = Loom.setVolume(volume);
            routed = true;
          }
        } catch (err) { /* [7] not parsed yet — Synth path */ }
        if (!routed && typeof Synth.setVolume === "function") {
