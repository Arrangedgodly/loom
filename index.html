          try { Synth.setVolume(volume); } catch (err) { /* stub era */ }
        }
      }

      /* -- boot ------------------------------------------------------------------------ */
      function init() {
        overlayEl = document.getElementById("overlay");
        beginBtn  = document.getElementById("begin-btn");
        chromeEl  = document.getElementById("chrome");
        playBtn   = document.getElementById("play-btn");
        volSlider = document.getElementById("volume-slider");
        readoutEl = document.getElementById("rule-scale-readout");
        liveEl    = document.getElementById("sr-live");

        /* V2-CTL: configuration panel elements + chips (static markup) */
        canvasEl       = document.getElementById("loom-canvas");
        cfgToggle      = document.getElementById("config-toggle");
        cfgPanel       = document.getElementById("config-panel");
        cfgRuleInput   = document.getElementById("rule-input");
        cfgTempoSlider = document.getElementById("tempo-slider");
        cfgTempoValue  = document.getElementById("tempo-value");
        cfgScaleSelect = document.getElementById("scale-select");
        reseedBtn      = document.getElementById("reseed-btn");
        resetBtn       = document.getElementById("reset-btn");
        chips = Array.prototype.slice.call(
          document.querySelectorAll("#rule-chips .chip"));

        if (readoutEl) {
          refreshReadout();   // "Rule <live rule> · <live scale> · <tempo>"
        }
        if (volSlider) volSlider.value = String(volume);  // JS owns the value
        onVolumeInput();  // T-A11Y: seeds aria-valuetext from that value
        if (beginBtn) beginBtn.addEventListener("click", begin);
        if (playBtn) playBtn.addEventListener("click", togglePause);
        if (volSlider) volSlider.addEventListener("input", onVolumeInput);
        if (cfgToggle) cfgToggle.addEventListener("click", toggleConfigPanel);
        if (cfgRuleInput) {
          cfgRuleInput.addEventListener("change", onRuleCommit);
        }
        if (cfgTempoSlider) {
          cfgTempoSlider.addEventListener("input", onTempoInput);
          cfgTempoSlider.addEventListener("change", onTempoCommit);
        }
        if (cfgScaleSelect) {
          cfgScaleSelect.addEventListener("change", onScaleChange);
        }
        if (reseedBtn) reseedBtn.addEventListener("click", onReseed);
        if (resetBtn) resetBtn.addEventListener("click", onReset);
        for (let i = 0; i < chips.length; i++) {
          const chip = chips[i];
          chip.addEventListener("click", () => {
            if (!loomReady()) return;
            if (Loom.applyRule(Number(chip.getAttribute("data-rule")))) {
              cfgSig = "";
              syncLoomControls();
            }
          });
        }

        document.addEventListener("mousemove", showChrome);
        document.addEventListener("pointerdown", showChrome);
        document.addEventListener("visibilitychange", onVisibility);
        document.addEventListener("keydown", onKeyDown);
        if (chromeEl) {
          chromeEl.addEventListener("focusin", showChrome);
          chromeEl.addEventListener("focusout", armChromeFade);
        }
        watchReducedMotion();  // T-A11Y: freeze the weave if asked to

        /* V2-CTL follow-up: arm the readout's [7] onChange subscription the
           moment the parse task ends — a microtask queued here fires after
           section [7] has parsed but BEFORE any event, timer or paint, so
           no external writer (console script, MCP tool) can beat the arm;
           the timeout is the belt for engines without queueMicrotask. */
        const armWatch = () => watchLoomReadout();
        if (typeof queueMicrotask === "function") queueMicrotask(armWatch);
        else setTimeout(armWatch, 0);
      }

      /* -- embedded acceptance harness (?selftest) — T-A11Y ------------------- */
      /* DOM-level checks of the floor: labels + live region + slider range
         (a), announcement plumbing + illegal-edge inertness (b), the
         reduced-motion seam round-trip (c), focusability + the gone-card /
         hidden-chrome focus semantics (d), aria-valuetext sync (e). The
         live keyboard walk itself (trusted Tab/Enter/Space/arrows) cannot
         be synthesized from inside the page — the task's CDP harness owns
         it. Pure DOM, no audio: works from file:// like the other suites. */
      function selfTest() {
        const tag = "[T-A11Y selftest]";
        let failed = 0;
        function report(id, ok, detail) {
          console.log(tag + " " + (ok ? "PASS" : "FAIL") + " " + id +
                      (ok || detail === undefined ? "" : " — " + detail));
          if (!ok) failed++;
        }
        const labelOf = (el) =>
          el ? (el.getAttribute("aria-label") || "").trim() : "";

        /* (a) every control + the canvas named; slider carries min/max;
           the live region is a polite status. */
        const canvas = document.getElementById("loom-canvas");
        const live = document.getElementById("sr-live");
        report(
          "a: aria labels — Begin/Play buttons + canvas named, volume " +
          "slider named with min 0 / max 1, polite role=status live region",
          labelOf(beginBtn).length > 0 &&
          (labelOf(playBtn) === "Play" || labelOf(playBtn) === "Pause") &&
          !!canvas && labelOf(canvas).length > 0 &&
          !!volSlider && labelOf(volSlider) === "Volume" &&
          volSlider.getAttribute("min") === "0" &&
          volSlider.getAttribute("max") === "1" &&
          !!live && live.getAttribute("role") === "status" &&
          live.getAttribute("aria-live") === "polite",
          "begin='" + labelOf(beginBtn) + "' play='" + labelOf(playBtn) +
          "' volume='" + labelOf(volSlider) + "' canvas=" +
          (canvas ? labelOf(canvas).length + " chars" : "missing") +
          " live=" + (live ? live.getAttribute("role") : "missing"));

        /* (b) announce() writes the region; togglePause stays a silent
           no-op in idle (never a console error, never a weave start). */
        announce("selftest probe");
        const probeOk = !!liveEl && liveEl.textContent === "selftest probe";
        togglePause();                       // idle: illegal edge → no-op
        announce("");                        // quiet the region again
        report("b: live-region plumbing — announce() writes #sr-live; " +
               "togglePause no-ops in idle", probeOk && state === "idle");

        /* (c) reduced-motion seam: the renderer flag round-trips and the
           shell's live media state is restored after the probe. */
        let okC = typeof Renderer !== "undefined" &&
                  typeof Renderer.setReducedMotion === "function" &&
                  typeof Renderer.reducedMotion === "boolean";
        if (okC) {
          const before = Renderer.reducedMotion;
          Renderer.setReducedMotion(true);
          okC = Renderer.reducedMotion === true;
          Renderer.setReducedMotion(false);
          okC = okC && Renderer.reducedMotion === false;
          applyReducedMotion();              // restore the real media state
          okC = okC && Renderer.reducedMotion === before;
        }
        report("c: reduced-motion seam — Renderer.setReducedMotion/" +
               "reducedMotion round-trip, shell media state restored", okC);

        /* (d) focus floor: natively focusable controls; dismissCard's
           gone+inert pair pulls the card from the tab order at once (its
           visibility flip follows the 0.9 s fade by design — CSS-delayed);
           a hidden chrome makes its controls unfocusable via visibility. */
        let okD = !!beginBtn && beginBtn.tagName === "BUTTON" &&
                  !!playBtn && playBtn.tagName === "BUTTON" &&
                  !!volSlider && volSlider.tagName === "INPUT" &&
                  getComputedStyle(volSlider).visibility === "hidden";
        if (okD && overlayEl) {
          overlayEl.classList.add("gone");
          overlayEl.inert = true;            // dismissCard's exact pair
          okD = overlayEl.classList.contains("gone") &&
                overlayEl.inert === true;
          overlayEl.inert = false;
          overlayEl.classList.remove("gone");
        }
        report("d: focus floor — button/input controls; gone+inert card " +
               "leaves the tab order immediately; hidden chrome " +
               "visibility-hidden (unfocusable)", okD);

        /* (e) volume slider: aria-valuetext tracks the value in percent
           and the remembered volume feeds the synth seam. */
        volSlider.value = "0.5";
        onVolumeInput();
        const vt = volSlider.getAttribute("aria-valuetext");
        const volOk = vt === "50 percent" && volume === 0.5;
        volSlider.value = "0.7";
        onVolumeInput();                     // restore the ship default
        report("e: volume slider — aria-valuetext follows input (0.5 → " +
               "'50 percent'), value feeds the setVolume seam", volOk,
               "valuetext='" + vt + "' volume=" + volume);

        console.log(tag + (failed === 0
          ? " ALL PASS — acceptance a-e green for T-A11Y"
          : " FAIL — " + failed + " check(s) failed"));
      }

      const api = {
        init,
        begin,
        togglePause,
        refreshReadout,   // V2-ENGINE seam: live rule/scale → chrome readout
        get state() { return state; },
        get audioContext() { return audioCtx; },  // fallback ctx while [4] is a stub
      };

      init();  // boot at load: state idle, title card up, zero timers running
      if (String(location.search).indexOf("selftest") !== -1) selfTest();
      return api;
    })();

    /* ======================================================================
     * [7] LOOM CONFIG — owner V2-ENGINE (runtime reconfiguration contract)
     * ----------------------------------------------------------------------
     * Contract:
     *   Consumes: CA.setRule / CA.setSeed / CA.rule / CA.seedId (section
     *     [2]); Scheduler.setTempo / Scheduler.rowsPerSecond (section [3]
     *     — the live-tempo rebase); SCALE from section [1] (fields mutated
     *     IN PLACE — the const binding stays, so every [4] reader and the
     *     [6] readout see the live scale); Synth.setVolume / Synth.volume
     *     (section [4] — the volume source of truth, so the [6] slider's
     *     direct writes stay visible to getState()); Shell.refreshReadout
     *     (section [6] seam, typeof-guarded).
     *   Produces (namespace Loom) — THE single config contract consumed by
     *     V2-CTL (controls), V2-STATE (URL hash) and V2-MCP (tools); one
     *     source of truth, no consumer-specific paths. Every parameter
     *     lives in its OWNING engine; getState() aggregates them live:
     *     Loom.getState()        snapshot { rule, rowsPerSecond, scaleId,
     *                            scaleName, seedId, volume }
     *     Loom.applyConfig(partial)  applies any subset of those fields
     *                            (synonym keys accepted: tempo →
     *                            rowsPerSecond, scale → scaleId, seed →
     *                            seedId); returns getState()
     *     Loom.applyRule(n)      integer 0–255 → the CA's runtime rule,
     *                            effective on the next scheduled row (live
     *                            mid-flight — timing untouched); false +
     *                            no change on rejection
     *     Loom.applyTempo(rps)   clamped into TEMPO_MIN_RPS..TEMPO_MAX_RPS;
     *                            Scheduler.setTempo rebases the grid (no
     *                            burst, no drift; ≤ SCHEDULE_AHEAD_S
     *                            transition lag); the [5] scroll law
     *                            follows live; returns the effective rps
     *     Loom.applyScale(id)    registry id → SCALE fields swapped in
     *                            place + the [6] readout refreshed; false
     *                            on an unknown id
     *     Loom.reseed(seedId?)   deterministic derived seed (0 / omitted =
     *                            the canonical single centered cell, v1);
     *                            at the anchor row 0 is re-planted;
     *                            mid-flight the NEXT scheduled row becomes
     *                            the seed row (rowIndex never rewinds —
     *                            grid, ring, scroll and pulses stay
     *                            coherent; criterion ⑫)
     *     Loom.setVolume(v)      clamped 0..1 → Synth.setVolume; returns
     *                            the effective volume
     *     Loom.scales            the curated scale registry (copies; entry
     *                            0 snapshots the locked v1 default from
     *                            [1] at parse time, so restoring it
     *                            restores T-TUNE's values exactly)
     *     Loom.limits            { minRowsPerSecond, maxRowsPerSecond,
     *                            maxSeedId, minVolume, maxVolume } — for
     *                            control/tool schemas
     *     Loom.onChange(fn)      V2-STATE seam: subscribe a listener that
     *                            fires after EVERY successful mutator above
     *                            (the URL-hash sync, section [8], and any
     *                            future observer subscribe here; listeners
     *                            are try/isolated so a broken observer can
     *                            never break the config path)
     *   Seed derivation is hash-encodable: a URL state carries only the
     *     integer id; the spec at seedBit() in [2] reproduces the row on
     *     any implementation. Determinism: any configured state is a pure
     *     function of its parameters + the operations applied (criterion
     *     6 restated for v2); the default state is bit-identical v1.
     *     Acceptance harness: ?selftest adds the [V2-ENGINE selftest]
     *     suite (evaluator spot-checks vs independent references,
     *     reconfiguration determinism, tempo-rebase arithmetic, config
     *     round-trip).
     * ====================================================================== */
    /* Config-local bounds (product surface, not musical values — the [3]/[5]
       naming convention for structural constants). */
    const TEMPO_MIN_RPS = 0.5;          // sane live-tempo bounds (glacial to
    const TEMPO_MAX_RPS = 8;            // brisk — keeps the horizon, queue
                                        // and scroll law comfortable)
    const SEED_ID_MAX   = 4294967295;   // uint32 seed ids (hash hygiene)

    /* Curated scale registry — the applyScale id space (V2-CTL chips and
       V2-MCP schemas enumerate Loom.scales). Entry 0 SNAPSHOTS the locked
       v1 default from [1] at parse time: applyScale(default) restores the
       T-TUNE-approved values even after other scales, and a future [1]
       retune follows automatically. */
    const SCALES = [
      { id: "a-minor-pentatonic", name: SCALE.name, rootHz: SCALE.rootHz,
        intervals: SCALE.intervals.slice() },          // the v1 default
      { id: "c-major-pentatonic", name: "C major pentatonic",
        rootHz: 261.6255653, intervals: [0, 2, 4, 7, 9] },
      { id: "a-natural-minor", name: "A natural minor", rootHz: 220,
        intervals: [0, 2, 3, 5, 7, 8, 10] },
      { id: "c-major", name: "C major", rootHz: 261.6255653,
        intervals: [0, 2, 4, 5, 7, 9, 11] },
      { id: "d-dorian", name: "D dorian", rootHz: 293.6647639,
        intervals: [0, 2, 3, 5, 7, 9, 10] },
      { id: "a-hirajoshi", name: "A hirajoshi", rootHz: 220,
        intervals: [0, 2, 3, 7, 8] },
      { id: "a-whole-tone", name: "A whole tone", rootHz: 220,
        intervals: [0, 2, 4, 6, 8, 10] },
      { id: "a-blues", name: "A blues", rootHz: 220,
        intervals: [0, 3, 5, 6, 7, 10] },
    ];

    const Loom = (() => {
      let scaleId = SCALES[0].id;   // the only config-OWNED field — every
                                    // other parameter lives in its engine
                                    // and getState() reads it from there

      const clampNum = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

      /* V2-STATE seam: config-change notifier. Every successful mutator
         below calls notifyChange() once its change is live — a single
         subscription point for the URL-hash sync (section [8]) and future
         observers. applyConfig needs no call of its own: it composes the
         mutators. Listener bodies are try/isolated (one broken observer
         must never break the config path). */
      const configListeners = [];
      function onChange(fn) {
        if (typeof fn === "function") configListeners.push(fn);
      }
      function notifyChange() {
        for (let i = 0; i < configListeners.length; i++) {
          try { configListeners[i](); } catch (err) { /* isolated */ }
        }
      }

      function refreshReadout() {
        if (typeof Shell !== "undefined" &&
            typeof Shell.refreshReadout === "function") {
          try { Shell.refreshReadout(); } catch (err) { /* no chrome */ }
        }
      }

      function applyRule(n) {
        if (typeof CA === "undefined" ||
            typeof CA.setRule !== "function") return false;
        if (!CA.setRule(n)) return false;      // rejected: no change
        refreshReadout();
        notifyChange();                        // V2-STATE seam
        return true;
      }

      function applyTempo(rps) {
        if (typeof Scheduler === "undefined" ||
            typeof Scheduler.setTempo !== "function") {
          return ROWS_PER_SECOND;
        }
        const v = Number(rps);
        if (!Number.isFinite(v)) return Scheduler.rowsPerSecond;
