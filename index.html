     *     Boot: parse(location.hash) → Loom.applyConfig BEFORE the first
     *       rendered frame. This whole <script> executes synchronously
     *       during parse, so no rAF callback — no painted frame — can run
     *       before it: a hashed load never flashes the default weave (the
     *       CA sits at its anchor row 0, so a hashed seed re-plants row 0
     *       immediately). The shell stays `idle` — running state is NOT
     *       hash state; every load starts at the title card.
     *     Live sync: every config change — panel controls, any Loom
     *       apply* (including the future V2-MCP tools), the hash boot
     *       itself — fires the [7] onChange seam; LoomState coalesces it
     *       per animation frame and rewrites the hash with
     *       history.replaceState (NEVER pushState: back/forward gain no
     *       entries; a slider drag produces at most one rewrite per
     *       frame, exact at rest). Rewrites are skipped when the hash
     *       already equals the canonical encoding; the rewrite also
     *       CANONICALIZES the URL in place (malformed input values heal
     *       to their effective config; unknown keys are dropped).
     *     LoomState.parse(h)    hash string → raw key/value map (strings)
     *     LoomState.coerce(map) raw map → validated partial config for
     *                          Loom.applyConfig (bad keys dropped)
     *     LoomState.encode()    live Loom.getState() → canonical hash
     *                          string ("" for the default state)
     *     LoomState.syncNow()   synchronous canonical rewrite (also the
     *                          copy path); returns success
     *     LoomState.shareUrl()  the absolute URL incl. canonical hash
     *     Copy link             #copy-link-btn (config panel) copies
     *                          shareUrl() via navigator.clipboard, falling
     *                          back to a textarea + execCommand("copy"),
     *                          falling back to a SELECTED visible input
     *                          (file:// included, never a dead end);
     *                          brief button feedback + a polite #sr-live
     *                          announcement; the button lives inside the
     *                          fade-governed chrome (focus keepalive
     *                          applies unchanged)
     *     ?selftest adds the [V2-STATE selftest] suite: round-trip
     *                          property (criterion ⑪) over representative
     *                          + edge configs, parse robustness, live
     *                          sync/history hygiene, copy-link surface.
     *   No localStorage, no persistence beyond the hash (v2 scope).
     * ====================================================================== */
    const LoomState = (() => {
      const KEYS = ["r", "t", "s", "d", "v"];

      /* Canonical default snapshot — captured at THIS section's boot,
         before any hash is applied (under ?selftest the earlier suites
         restore the pristine v1 anchor before handing over — their own
         final checks verify it). encode()'s "differs from default?"
         comparisons read this frozen baseline, so the canonical form is
         stable even while the live state is a hashed one. */
      const DEF = Loom.getState();

      const isDigits = (s) => /^[0-9]+$/.test(s);
      const num = (v) => +(Number(v).toFixed(4));   // canonical resolution
      const fmt = (v) => String(num(v));            // shortest round-trip

      function scaleKnown(id) {
        if (typeof id !== "string") return false;
        for (let i = 0; i < SCALES.length; i++) {
          if (SCALES[i].id === id) return true;
        }
        return false;
      }

      /* -- parse -------------------------------------------------------------- */
      function parse(h) {
        const out = {};
        if (typeof h !== "string") return out;
        const s = h.charAt(0) === "#" ? h.slice(1) : h;
        if (s.length === 0) return out;
        const tokens = s.split("&");
        for (let i = 0; i < tokens.length; i++) {
          const eq = tokens[i].indexOf("=");
          if (eq <= 0) continue;               // no key / empty key → junk
          const key = tokens[i].slice(0, eq);
          if (KEYS.indexOf(key) === -1) continue;   // unknown/future → ignored
          let raw = tokens[i].slice(eq + 1);
          try { raw = decodeURIComponent(raw); } catch (err) { continue; }
          if (raw === "") continue;            // empty value → malformed
          out[key] = raw;                      // duplicates: last wins
        }
        return out;
      }

      /* -- coerce (per-key validation / fallback) ------------------------------ */
      function coerce(map) {
        const cfg = {};
        if (map.r !== undefined && isDigits(map.r)) {
          const n = Number(map.r);
          if (n >= 0 && n <= 255) cfg.rule = n;
        }
        if (map.t !== undefined) {
          const n = Number(map.t);
          if (Number.isFinite(n) && n > 0) cfg.rowsPerSecond = n;
        }
        if (map.s !== undefined && scaleKnown(map.s)) cfg.scaleId = map.s;
        if (map.d !== undefined && isDigits(map.d)) {
          const n = Number(map.d);
          if (n >= 0 && n <= SEED_ID_MAX) cfg.seedId = n;
        }
        if (map.v !== undefined) {
          const n = Number(map.v);
          if (Number.isFinite(n)) cfg.volume = n;
        }
        return cfg;
      }

      /* -- encode (canonical) --------------------------------------------------- */
      function encode() {
        const st = Loom.getState();
        const parts = [];
        if (st.rule !== DEF.rule) parts.push("r=" + st.rule);
        if (num(st.rowsPerSecond) !== num(DEF.rowsPerSecond)) {
          parts.push("t=" + fmt(st.rowsPerSecond));
        }
        if (st.scaleId !== DEF.scaleId) parts.push("s=" + st.scaleId);
        if (st.seedId !== DEF.seedId) parts.push("d=" + st.seedId);
        if (num(st.volume) !== num(DEF.volume)) {
          parts.push("v=" + fmt(st.volume));
        }
        return parts.join("&");
      }

      /* -- URL sync (replaceState only — zero history entries) ------------------ */
      function syncNow() {
        let h;
        try { h = encode(); } catch (err) { return false; }
        const want = h.length > 0 ? "#" + h : "";
        if (location.hash === want) return true;      // already canonical
        try {
          history.replaceState(history.state, "",
                               location.pathname + location.search + want);
        } catch (err) {
          return false;   // exotic embedding — in-page config still lives
        }
        return true;
      }

      /* rAF-coalesced sync: a drag fires many notifications; at most one
         rewrite per frame, exact at rest (the resting value is what the
         last frame encodes). */
      let syncQueued = false;
      function scheduleSync() {
        if (syncQueued) return;
        syncQueued = true;
        const flush = () => { syncQueued = false; syncNow(); };
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(flush);
        } else {
          setTimeout(flush, 16);
        }
      }

      /* -- copy-link affordance -------------------------------------------------- */
      const copyBtn = document.getElementById("copy-link-btn");
      let feedbackTimer = 0;

      function announceState(msg) {
        const live = document.getElementById("sr-live");
        if (live) live.textContent = msg;   // the existing polite region
      }

      function setFeedback(label, msg) {
        announceState(msg);
        if (!copyBtn) return;
        copyBtn.textContent = label;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {   // brief — the fade rules own
          feedbackTimer = 0;                 // the chrome, not this timer
          copyBtn.textContent = "Copy link";
        }, 1600);
      }

      function shareUrl() {
        syncNow();   // the copied URL carries the RESTING config's hash
        return location.href;
      }

      /* Fallback chain for contexts without a working async clipboard
         (denied permission, older engines): a transient textarea +
         document.execCommand("copy"); if even that fails the textarea
         STAYS — focused with the URL selected — so a manual Ctrl/Cmd+C
         is one keystroke away. Never a dead end; file:// included. */
      function fallbackCopy(url) {
        const ta = document.createElement("textarea");
        ta.id = "copy-fallback-input";
        ta.value = url;
        ta.setAttribute("readonly", "");
        ta.setAttribute("aria-label",
                        "Configuration link — press Control or Command C " +
                        "to copy");
        ta.style.position = "fixed";
        ta.style.left = "50%";
        ta.style.top = "50%";
        ta.style.transform = "translate(-50%, -50%)";
        ta.style.zIndex = "40";
        ta.style.width = "min(34rem, 80vw)";
        ta.style.padding = "0.6rem 0.8rem";
        ta.style.font = "inherit";
        ta.style.fontSize = "0.72rem";
        ta.style.color = "#dfe7ff";
        ta.style.background = "rgba(10, 13, 20, 0.92)";
        ta.style.border = "1px solid rgba(185, 208, 255, 0.35)";
        ta.style.borderRadius = "8px";
        ta.style.boxShadow = "0 0 24px rgba(185, 208, 255, 0.18)";
        document.body.appendChild(ta);
        let ok = false;
        try {
          ta.focus({ preventScroll: true });
          ta.select();
          ta.setSelectionRange(0, url.length);
          ok = document.execCommand("copy");
        } catch (err) { ok = false; }
        if (ok) {
          ta.remove();
          return true;
        }
        /* last resort: keep it selected + visible until focus leaves it
           (a click anywhere else blurs → removes) or Escape dismisses */
        let dismissed = false;   // idempotent: removing the FOCUSED node
        const dismiss = () => {  // fires blur synchronously — the reentrant
          if (dismissed) return; // second call must no-op (no double remove)
          dismissed = true;
          ta.remove();
        };
        ta.addEventListener("blur", dismiss);
        ta.addEventListener("keydown", (e) => {
          if (e.key === "Escape") dismiss();
        });
        try { ta.focus({ preventScroll: true }); ta.select(); } catch (err) {}
        return false;
      }

      function copyLink() {
        const url = shareUrl();
        const finish = (ok) => setFeedback(
          ok ? "Copied" : "Link selected",
          ok ? "Configuration link copied"
             : "Copy blocked — link selected, press Control or Command C");
        if (navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function") {
          navigator.clipboard.writeText(url).then(
            () => finish(true),
            () => finish(fallbackCopy(url)));
          return;
        }
        finish(fallbackCopy(url));
      }

      if (copyBtn) copyBtn.addEventListener("click", copyLink);
      if (typeof Loom.onChange === "function") Loom.onChange(scheduleSync);

      /* -- embedded acceptance harness (?selftest) ------------------------------
         Pure codec + DOM checks: grammar/defaults (a), parse robustness
         (b), the round-trip property over representative + edge configs
         (c — criterion ⑪), malformed/clamp end-to-end (d), live sync +
         history hygiene + the onChange plumbing (e), the copy-link
         surface (f). The trusted-gesture clipboard write and the
         painted-frame-no-flash check need a real browser session — the
         task's CDP harness owns those. */
      function selfTest() {
        const tag = "[V2-STATE selftest]";
        let failed = 0;
        function report(id, ok, detail) {
          console.log(tag + " " + (ok ? "PASS" : "FAIL") + " " + id +
                      (ok || detail === undefined ? "" : " — " + detail));
          if (!ok) failed++;
        }
        const sameState = (a, b) =>
          a.rule === b.rule && a.rowsPerSecond === b.rowsPerSecond &&
          a.scaleId === b.scaleId && a.seedId === b.seedId &&
          a.volume === b.volume;
        const loaded = Loom.getState();   // the page's own (possibly
                                          // hashed) load state — restored
                                          // at the end
        const histBefore = history.length;
        const searchBefore = location.search;

        /* (a) grammar + defaults + codec surface */
        Loom.applyConfig(DEF);            // canonical defaults, one call
        const encDefault = encode();
        const okA = encDefault === "" &&
          Object.keys(parse("")).length === 0 &&
          Object.keys(parse("#")).length === 0 &&
          DEF.rule === CA_RULE &&
          DEF.rowsPerSecond === ROWS_PER_SECOND &&
          DEF.seedId === 0 && Math.abs(DEF.volume - 0.7) < 1e-9 &&
          DEF.scaleId === SCALES[0].id &&
          typeof api.parse === "function" &&
          typeof api.coerce === "function" &&
          typeof api.encode === "function" &&
          typeof api.syncNow === "function" &&
          typeof api.shareUrl === "function" &&
          typeof Loom.onChange === "function";
        report("a: grammar + defaults — the canonical default state " +
               "encodes as NO hash (no-hash load = canonical default); " +
               "parse('')/parse('#') empty; the default snapshot IS the " +
               "locked v1 state (rule " + CA_RULE + ", " + ROWS_PER_SECOND +
               " rows/s, seed 0, volume 0.7, registry scale 0); codec " +
               "surface + the [7] onChange seam present", okA,
               "encode '" + encDefault + "'");

        /* (b) parse robustness — unknown keys ignored, junk skipped,
           duplicates last-wins, malformed values dropped per key */
        const J = (o) => JSON.stringify(o);
        const okB =
          J(parse("#foo=1&x=9&r=90")) === '{"r":"90"}' &&
          J(parse("#r=110&t=1.8&s=a-blues&d=42&v=0.35")) ===
            '{"r":"110","t":"1.8","s":"a-blues","d":"42","v":"0.35"}' &&
          J(parse("#r=110&r=184")) === '{"r":"184"}' &&
          J(parse("#r")) === "{}" &&
          J(parse("#=5")) === "{}" &&
          J(parse("#&&")) === "{}" &&
          J(parse("#r=")) === "{}" &&
          J(parse("#R=110")) === "{}" &&
          J(parse("#s=%zz")) === "{}" &&
          J(parse("#r=%31%31%30")) === '{"r":"110"}' &&
          J(coerce({ r: "300" })) === "{}" &&
          J(coerce({ r: "-1" })) === "{}" &&
          J(coerce({ r: "1.5" })) === "{}" &&
          J(coerce({ r: "0" })) === '{"rule":0}' &&
          J(coerce({ t: "xyz" })) === "{}" &&
          J(coerce({ t: "0" })) === "{}" &&
          J(coerce({ t: "-2" })) === "{}" &&
          coerce({ t: "99" }).rowsPerSecond === 99 &&
          coerce({ s: "nope" }).scaleId === undefined &&
          J(coerce({ d: "1.5" })) === "{}" &&
          coerce({ d: "4294967296" }).seedId === undefined &&
          coerce({ d: "4294967295" }).seedId === 4294967295 &&
          J(coerce({ v: "abc" })) === "{}" &&
          coerce({ v: "2" }).volume === 2;
        report("b: parse robustness — unknown/future keys ignored, junk " +
               "tokens skipped, duplicates last-wins, keys case-sensitive, " +
               "undecodable values dropped; malformed values fall back " +
               "per-key (r 300/-1/1.5, t xyz/0/-2, s unknown, d 1.5/2^32, " +
               "v abc) while out-of-range t/v survive to the engine clamps",
               okB);

        /* (c) round-trip property (criterion ⑪): load(hash) → getState
           === the parsed config, and re-encode(getState()) === the
           normalized hash — idempotently, for edge configs too. */
        const CASES = [
          {},                                  // canonical defaults
          { rule: 0 }, { rule: 255 }, { rule: 110 },
          { rowsPerSecond: 0.5 }, { rowsPerSecond: 8 },
          { seedId: 1 }, { seedId: 4294967295 },
          { volume: 0 }, { volume: 1 },
          { scaleId: "a-blues" },
          { rule: 110, rowsPerSecond: 1.8, scaleId: "a-blues",
            seedId: 42, volume: 0.35 },
          { rule: CA_RULE, rowsPerSecond: ROWS_PER_SECOND,
            scaleId: SCALES[0].id, seedId: 0, volume: 0.7 },
        ];
        let whyC = "";
        for (let i = 0; i < CASES.length && !whyC; i++) {
          Loom.applyConfig(CASES[i]);
          const st1 = Loom.getState();
          const h = encode();
          Loom.applyConfig(coerce(parse("#" + h)));
          const st2 = Loom.getState();
          if (!sameState(st1, st2) || encode() !== h) {
            whyC = "case " + J(CASES[i]) + " → '" + h + "'";
          }
        }
        report("c: round-trip property — " + CASES.length + " configs " +
               "(defaults; rule 0/255; tempo bounds 0.5/8 rows/s; seeds 1 " +
               "and 2^32−1; volume 0/1; a registry scale; the full mix; " +
               "explicit defaults → ''): apply → encode → parse+apply " +
               "reproduces the exact state AND the exact hash " +
               "(re-encode idempotent)", whyC === "", whyC);

        /* (d) malformed + out-of-range end-to-end through a real hash */
        Loom.applyConfig(coerce(parse("#t=99&v=2&r=256&d=4294967296&s=nope")));
        const stD = Loom.getState();
        const okD = stD.rowsPerSecond === TEMPO_MAX_RPS &&
                    stD.volume === 1 && stD.rule === CA_RULE &&
                    stD.seedId === 0 && stD.scaleId === SCALES[0].id &&
                    encode() === "t=8&v=1";
        report("d: malformed + out-of-range end-to-end — '#t=99&v=2&r=256&" +
               "d=4294967296&s=nope' loads as clamped tempo 8 rows/s and " +
               "volume 1 with rule/seed/scale at their per-key defaults, " +
               "and canonicalizes to '#t=8&v=1'", okD,
               J(stD) + " → '" + encode() + "'");

        /* (e) live sync + history hygiene + the onChange plumbing */
        Loom.applyConfig({ rule: 184, rowsPerSecond: 3.2,
                           scaleId: "d-dorian", seedId: 7, volume: 0.2 });
        const hashAfterSync = location.hash;
        const okSync = syncNow() &&
          location.hash === "#r=184&t=3.2&s=d-dorian&d=7&v=0.2" &&
          location.hash === "#" + encode();
        let fired = 0;
        Loom.onChange(() => { fired++; });
        Loom.applyTempo(4);
        Loom.applyTempo(4);   // same value: the seam still fires (the
        const notifyOk = fired === 2;   // sync diff-skips, no rewrite)
        Loom.applyTempo(ROWS_PER_SECOND);
        Loom.applyConfig(DEF);
        const okReset = syncNow() && location.hash === "";
        report("e: live sync — one applyConfig lands the exact canonical " +
               "hash via replaceState (coalesced rAF path verified by the " +
               "harness); every mutator fires the onChange seam (panel/" +
               "MCP/hash writes all reach the hash); location.search " +
               "preserved ('" + searchBefore + "'); restoring defaults " +
               "clears the hash; history.length unchanged (zero entries " +
               "added)", okSync && notifyOk && okReset &&
               location.search === searchBefore &&
               history.length === histBefore,
               "sync " + okSync + " (pre-flush '" + hashAfterSync + "'), " +
               "notify " + notifyOk + ", reset " + okReset);

        /* (f) copy-link affordance surface (the trusted-gesture clipboard
           write itself is the task harness's to verify) */
        const btn = document.getElementById("copy-link-btn");
        Loom.applyConfig({ rule: 90 });   // non-default → a live hash
        syncNow();
        const url = shareUrl();
        const okF = !!btn && btn.tagName === "BUTTON" &&
          !!btn.closest("#config-panel") &&
          (btn.getAttribute("aria-label") || "").length > 0 &&
          btn.textContent === "Copy link" &&
          url === location.href && /#r=90$/.test(url);
        report("f: copy-link affordance — labelled keyboard-operable " +
               "button inside the config panel; shareUrl() returns the " +
               "absolute URL carrying the canonical hash ('…" +
               url.slice(-24) + "'); clipboard + fallback exercised by the " +
               "task's trusted-gesture harness", okF, "url " + url);

        /* restore the page's own loaded state + canonical hash */
        Loom.applyConfig({ rule: loaded.rule,
                           rowsPerSecond: loaded.rowsPerSecond,
                           scaleId: loaded.scaleId, seedId: loaded.seedId,
                           volume: loaded.volume });
        syncNow();
        console.log(tag + (failed === 0
          ? " ALL PASS — acceptance a-f green for V2-STATE"
          : " FAIL — " + failed + " check(s) failed"));
      }

      /* -- boot: apply the hash BEFORE the first rendered frame -----------------
       * Synchronous script execution guarantees no painted frame exists
       * yet (no rAF callback has run), so the FIRST drawn frame already
       * carries the hashed rule/seed — never a flash of the default
       * weave. CA sits at its anchor row 0, so a hashed seed re-plants
       * row 0 immediately; the shell stays idle (the title card). The
       * readout is refreshed for the tempo segment (applyRule/applyScale
       * refresh themselves inside [7]); scheduleSync() then canonicalizes
       * the URL in place — including the nothing-survived case. */
      const bootCfg = coerce(parse(location.hash));
      if (bootCfg.rule !== undefined ||
          bootCfg.rowsPerSecond !== undefined ||
          bootCfg.scaleId !== undefined || bootCfg.seedId !== undefined ||
          bootCfg.volume !== undefined) {
        Loom.applyConfig(bootCfg);
        if (typeof Shell !== "undefined" &&
            typeof Shell.refreshReadout === "function") {
          try { Shell.refreshReadout(); } catch (err) { /* no chrome */ }
        }
      }
      scheduleSync();

      const api = { parse, coerce, encode, syncNow, shareUrl };
      if (String(location.search).indexOf("selftest") !== -1) selfTest();
      return api;
    })();

    /* ======================================================================
     * [9] LOOM MCP — owner V2-MCP/V3-PAGE (external tool surface; http(s) only)
     * ----------------------------------------------------------------------
     * Contract:
     *   Consumes: the Loom config contract (section [7] — getState + the
     *     apply/reseed/setVolume functions + the scales/limits registries;
     *     the ONLY config surface the tools read or write); Shell.state /
     *     Shell.togglePause (section [6] — pause/resume drive the SAME
     *     transition the chrome's pause control drives); the #mcp-status
     *     line + the #mcp-consent "Allow remote control" checkbox in the
     *     config panel (this section's own chrome surfaces).
     *   Produces (namespace LoomMCP): the eight MCP tools mirroring the
     *     panel's controls one-to-one — get_state, set_rule, set_tempo,
     *     set_scale, reseed, set_volume, pause, resume — and the channel
     *     that exposes them to external MCP clients. V3: ONE tool
     *     registry, TWO transports behind it (the surface itself is
     *     transport-agnostic — a port, not a second implementation):
     *     - ACTIVATION GUARD: everything below runs ONLY on an http(s)
     *       origin. On file:// the section is INERT by construction — the
     *       guard returns before any EventSource or WebSocket is created,
     *       any fetch is armed or navigator.modelContext is probed; only
     *       the panel's status text ("MCP: dormant (file://)") is
     *       written, and the consent toggle never appears. The lean-back
     *       piece is completely untouched.
     *     - TRANSPORT 1 — the local bridge (?bridge=<origin>, the
     *       EXPLICIT override; it WINS over public attach, criterion ⑮):
     *       the V2 SSE+POST channel to the optional companion bridge
     *       loom-bridge.mjs, verbatim v2 behavior — EventSource GET
     *       <bridge>/bridge subscribes to tool invocations (native
     *       auto-reconnect on drop); fetch POST <bridge>/bridge/result
     *       carries the envelope back — {type:'hello', tools} when the
     *       stream opens, {id, result|error} per call. The consent
     *       toggle stays HIDDEN on these loads: a local bridge the user
     *       launched and pointed at is not remote control.
     *     - TRANSPORT 2 — the public attach (every other http(s) load;
     *       the default): consent-gated same-origin WEBSOCKET to the
     *       V3-WORKER Durable Object (wss://<this host>/attach on https,
     *       ws:// on http; ?attach=<ws|wss url> is the DEV override for
     *       driving a wrangler-dev DO from a page served elsewhere —
     *       cross-port WS needs no CORS). The panel's "Allow remote
     *       control" checkbox is the SINGLE consent surface: default
     *       OFF — an un-opted page constructs no WebSocket and no
     *       EventSource, sends nothing (criterion ⑭: zero network
     *       attempts); session-only memory (the checkbox's own DOM
     *       state — no storage API, no reload survival). Opting in
     *       opens the socket and sends the consent hello
     *       {type:'hello', tools, optIn:true} — the DO registers
     *       nothing before it. Tool calls arrive as {type:'call', id,
     *       name, arguments}; results return over the SAME socket as
     *       {type:'result', id, result|error} (dispatch() is shared
     *       with the bridge transport). Reconnect policy (recorded):
     *       a non-user close while opted-in retries with bounded
     *       exponential backoff + full jitter — delay drawn from
     *       [0, min(30 s, 500 ms · 2^step)], crypto-sourced (NOT
     *       Math.random — the file's single sanctioned Math.random
     *       stays the reseed pick), step reset on every successful
     *       open, retries continue while opted-in (DO restarts and
     *       deploys are covered: a fresh hello simply retakes the
     *       slot). A {type:'detached} takeover notice is HONORED — no
     *       auto-reconnect (two reconnecting opted-in tabs would
     *       ping-pong the one-driver slot forever); cycling the toggle
     *       off/on is the explicit way to retake it. "loom-ping"
     *       keepalives ride the DO's runtime auto-answer (no DO wake).
     *       Toggle-off mid-session = clean detach: socket closed,
     *       timers cleared, zero further attempts, status "MCP: off".
     *     - Schemas are built FROM the live contract (Loom.scales /
     *       Loom.limits), so MCP clients always see the real enums and
     *       bounds; the manifest order is deterministic.
     *     - One driver at a time: the channel keeps only the newest
     *       page attachment (last write wins); every tool answers with
     *       the new state snapshot. Argument failures are isError:true
     *       tool-execution errors with actionable text (the engine still
     *       clamps/rejects underneath — control parity); unknown tools
     *       are JSON-RPC -32602.
     *     - Status-line truthfulness (criterion ⑭): file:// →
     *       "MCP: dormant (file://)"; bridge → the v2 strings
     *       (connecting / active / inactive (no bridge)); public →
     *       off / connecting / attached (socket open, hello not yet
     *       sent) / driver-active (hello sent — this tab holds the
     *       one-driver slot until a detached notice or a close says
     *       otherwise) / reconnecting / superseded (another tab).
     *     - Bonus (W3C WebMCP draft, feature-detected — zero impact
     *       where the API does not exist): navigator.modelContext
     *       .registerTool mirrors the same eight handlers for
     *       in-browser agents (a LOCAL draft API, no network —
     *       deliberately outside the public-consent gate, unchanged
     *       from v2).
     *     Silent by the file-wide rule: no console output anywhere; all
     *     transport failures surface as the status line only.
     *     NO localStorage (the no-persistence rule).
     * ====================================================================== */
    const LoomMCP = (() => {
      const statusEl = document.getElementById("mcp-status");
      const consentGroup = document.getElementById("mcp-consent-group");
      const consentEl = document.getElementById("mcp-consent");
      const setStatus = (t) => { if (statusEl) statusEl.textContent = t; };

      /* -- URL parameters (parsed before the activation guard: pure input,
         no DOM writes, no network — the ?selftest suite asserts the mode
         invariants on every protocol) --------------------------------------
         ?bridge=<origin> — the EXPLICIT local-bridge override (V2): forces
           the SSE+POST transport and WINS over the public attach. */
      let bridge = location.origin, bridgeForced = false;
      {
        const q = /[?&]bridge=([^&]+)/.exec(location.search);
        if (q) {
          try {
            const u = new URL(decodeURIComponent(q[1]));
            bridge = u.origin;
            bridgeForced = true;
          } catch (err) { /* keep same-origin */ }
        }
      }

      /* -- V3 pure helpers: the public-attach URL + the backoff law -------
         Both are PURE (explicit args) so the ?selftest suite can exercise
         them without a socket. No Math.random anywhere — jitter draws on
         crypto so the file's single sanctioned Math.random stays the
         Reseed pick and the engine stays deterministic (the backoff is
         transport timing, never weave state). */
      const BACKOFF_BASE_MS = 500,   // step 0 jitter ceiling
            BACKOFF_CAP_MS = 30000,  // the bound the delays never exceed
            KEEPALIVE_MS = 50000;    // loom-ping cadence (runtime answers
                                     // without waking the DO)
      function wsUrlFor(search, loc) {
        /* ?attach=<ws|wss url> — the DEV override: a page served from any
           local http origin may point at a wrangler dev DO (cross-port WS
           needs no CORS; the DO's dev allowlist takes localhost origins).
           Anything that is not a clean ws/wss URL is ignored — same-origin
           /attach is the ship behavior. */
        const q = /[?&]attach=([^&]+)/.exec(String(search));
        if (q) {
          try {
            const u = new URL(decodeURIComponent(q[1]));
            if (u.protocol === "ws:" || u.protocol === "wss:") return u.href;
          } catch (err) { /* fall through to same-origin */ }
        }
        return (loc.protocol === "https:" ? "wss://" : "ws://") +
               loc.host + "/attach";
      }
      function backoffMs(step) {
        /* full jitter over an exponential ceiling: delay ~ U[0, cap),
           cap = min(BACKOFF_CAP_MS, BACKOFF_BASE_MS · 2^step) — capped
           growth (bounded at 30 s), expected delay half the ceiling */
        const cap = Math.min(BACKOFF_CAP_MS,
                             BACKOFF_BASE_MS * Math.pow(2, step));
        const b = new Uint32Array(1);
        crypto.getRandomValues(b);
        return Math.floor((b[0] / 4294967296) * cap);
      }

      /* -- V3 channel state (closure scope so the returned API is uniform
         across transports; only the public transport ever drives these) -- */
      let attachAttempts = 0;   // WebSocket constructions (observability)
      let optIn = false;        // the consent flag — the checkbox's own state
      let chan = "off";         // public-transport status state (see header)

      /* -- V3 selftest (?selftest — runs on EVERY protocol; mode-aware
         expectations so the check count is uniform) ---------------------- */
      function v3SelfTest() {
        const tag = "[V3-PAGE selftest]";
        let failed = 0;
        function report(id, ok, detail) {
          console.log(tag + " " + (ok ? "PASS" : "FAIL") + " " + id +
                      (ok || detail === undefined ? "" : " — " + detail));
          if (!ok) failed++;
        }
        const fileMode = location.protocol !== "http:" &&
                         location.protocol !== "https:";
        const mode = fileMode ? "file" : (bridgeForced ? "bridge" : "public");

        /* (a) the consent toggle: a labelled checkbox, default OFF, in the
           markup on every protocol (visibility is per-mode — check b) */
        const labelled = consentEl && consentEl instanceof HTMLInputElement &&
          consentEl.type === "checkbox" && !consentEl.checked &&
          (() => {
            const l = document.querySelector('label[for="mcp-consent"]');
            return !!l && /allow remote control/i.test(l.textContent);
          })();
        report("a: consent toggle is a labelled checkbox, default OFF",
               !!labelled);

        /* (b) toggle visibility per mode: hidden on file:// (inert) and on
           ?bridge= loads (the override owns the channel); visible on every
           other http(s) origin */
        const wantHidden = mode !== "public";
        report("b: toggle " + (wantHidden ? "hidden" : "visible") +
               " in " + mode + " mode",
               !!(consentGroup && (consentGroup.hidden === wantHidden)),
               "hidden=" + (consentGroup && consentGroup.hidden));

        /* (c) the status line is truthful at load for this mode */
        const wantStatus = { file: "MCP: dormant (file://)",
                             bridge: "MCP: connecting",
                             public: "MCP: off" }[mode];
        report("c: status line '" + wantStatus + "' in " + mode + " mode",
               !!statusEl && statusEl.textContent === wantStatus,
               "got '" + (statusEl && statusEl.textContent) + "'");

        /* (d) attach URL: same-origin /attach with the scheme mapped */
        const d1 = wsUrlFor("", { protocol: "https:",
                                  host: "loom.arrangedgodly.com" }) ===
                   "wss://loom.arrangedgodly.com/attach";
        const d2 = wsUrlFor("", { protocol: "http:",
                                  host: "localhost:8788" }) ===
                   "ws://localhost:8788/attach";
        report("d: attach URL is same-origin /attach (https→wss, http→ws)",
               d1 && d2);

        /* (e) the ?attach= DEV override: honored for ws/wss, ignored
           otherwise (garbage / other schemes fall back to same-origin) */
        const ov = "ws://localhost:8787/attach";
        const e1 = wsUrlFor("?attach=" + encodeURIComponent(ov),
                            { protocol: "https:", host: "x.example" }) === ov;
        const e2 = wsUrlFor("?attach=" + encodeURIComponent("http://x/attach"),
                            { protocol: "https:", host: "x.example" }) ===
                   "wss://x.example/attach";
        const e3 = wsUrlFor("?attach=not-a-url",
                            { protocol: "https:", host: "x.example" }) ===
                   "wss://x.example/attach";
        report("e: ?attach= override ws/wss-only, else same-origin",
               e1 && e2 && e3);

        /* (f) backoff law: full jitter bounded by the exponential cap */
        let fOk = true, fWhy = "";
        for (let step = 0; step <= 8; step++) {
          const cap = Math.min(BACKOFF_CAP_MS,
                               BACKOFF_BASE_MS * Math.pow(2, step));
          const d = backoffMs(step);
          if (!(d >= 0 && d < cap)) {
            fOk = false;
            fWhy = "step " + step + ": " + d + " not in [0," + cap + ")";
            break;
          }
        }
        report("f: backoff delays within [0, min(30s, 500ms·2^step))",
               fOk, fWhy);

        /* (g) zero attach attempts before consent — the criterion-⑭
           invariant at parse time (the checkbox is still unchecked; no
           WebSocket was ever constructed; bridge mode never arms the
           public transport at all) */
        report("g: zero attach attempts before consent (" + mode + " mode)",
               attachAttempts === 0 && !optIn,
               "attempts=" + attachAttempts + " optIn=" + optIn);

        console.log(tag + (failed === 0
          ? " ALL PASS — consent/attach invariants green for V3-PAGE"
          : " FAIL — " + failed + " check(s) failed"));
      }

      /* activation guard — MCP exists only on http(s) origins */
      if (location.protocol !== "http:" && location.protocol !== "https:") {
        setStatus("MCP: dormant (file://)");
        if (String(location.search).indexOf("selftest") !== -1) v3SelfTest();
        return { active: false, status: () => "dormant" };
      }

      /* -- the state snapshot every tool answers with ---------------------- */
      function playback() {
        const s = typeof Shell !== "undefined" &&
                  typeof Shell.state === "string" ? Shell.state : "idle";
        return { state: s, paused: s === "paused",
                 playing: s === "running" || s === "resumed" };
      }
      const snapshot = () => Object.assign(playback(), Loom.getState());

      function ok(note) {          // setter result: {applied, state}
        const sc = { applied: true, state: snapshot() };
        if (note) sc.note = note;
        return { resultType: "complete",
                 content: [{ type: "text", text: JSON.stringify(sc) }],
                 structuredContent: sc };
      }
      const invalid = (msg) => ({ resultType: "complete", isError: true,
                                  content: [{ type: "text", text: msg }] });
      const isInt = (v) => typeof v === "number" && Number.isInteger(v);
      const isNum = (v) => typeof v === "number" && Number.isFinite(v);

      /* -- the eight tools (thin Loom contract calls, nothing else) -------- */
      const L = Loom.limits;
      const TOOLS = {
        get_state() {
          const st = snapshot();
          return { resultType: "complete",
                   content: [{ type: "text", text: JSON.stringify(st) }],
                   structuredContent: st };
        },
        set_rule(a) {
          if (!isInt(a.rule) || a.rule < 0 || a.rule > 255) {
            return invalid("set_rule: 'rule' must be an integer 0-255 " +
                           "(presets 30, 90, 110, 184)");
          }
          return Loom.applyRule(a.rule) ? ok("rule " + a.rule)
            : invalid("set_rule: the engine rejected rule " + a.rule);
        },
        set_tempo(a) {
          if (!isNum(a.rowsPerSecond) ||
              a.rowsPerSecond < L.minRowsPerSecond ||
              a.rowsPerSecond > L.maxRowsPerSecond) {
            return invalid("set_tempo: 'rowsPerSecond' must be a number " +
                           L.minRowsPerSecond + "-" + L.maxRowsPerSecond);
          }
          return ok("tempo " + Loom.applyTempo(a.rowsPerSecond) + " rows/s");
        },
        set_scale(a) {
          if (typeof a.scaleId !== "string" ||
              !Loom.scales.some((s) => s.id === a.scaleId)) {
            return invalid("set_scale: 'scaleId' must be one of " +
                           Loom.scales.map((s) => s.id).join(", "));
          }
          return Loom.applyScale(a.scaleId) ? ok("scale " + a.scaleId)
            : invalid("set_scale: unknown scale " + a.scaleId);
        },
        reseed(a) {
          const seed = a.seedId === undefined ? 0 : a.seedId;
          if (!isInt(seed) || seed < 0 || seed > L.maxSeedId) {
            return invalid("reseed: 'seedId' must be an integer 0-" +
                           L.maxSeedId +
                           " (optional; omitted = the canonical seed)");
          }
          return Loom.reseed(seed) ? ok("seed " + seed)
            : invalid("reseed: the engine rejected seed " + seed);
        },
        set_volume(a) {
          if (!isNum(a.volume) || a.volume < L.minVolume ||
              a.volume > L.maxVolume) {
            return invalid("set_volume: 'volume' must be a number " +
                           L.minVolume + "-" + L.maxVolume);
          }
          return ok("volume " + Loom.setVolume(a.volume));
        },
        pause() {                   // the pause control's own transition
          if (playback().playing && typeof Shell !== "undefined" &&
              typeof Shell.togglePause === "function") {
            Shell.togglePause();
          }
          return ok("paused");
        },
        resume() {                  // no-op unless actually paused
          if (playback().state === "paused" &&
              typeof Shell !== "undefined" &&
              typeof Shell.togglePause === "function") {
            Shell.togglePause();
          }
          return ok("resumed");
        },
      };

      /* -- tool manifest (schemas FROM the live registries) ----------------- */
      function manifest() {
        const scaleIds = Loom.scales.map((s) => s.id);
        const none = { type: "object", properties: {},
                       additionalProperties: false };
        const stateOut = {
          type: "object",
          properties: {
            rule: { type: "integer" },
            rowsPerSecond: { type: "number" },
            scaleId: { type: "string" },
            scaleName: { type: "string" },
            seedId: { type: "integer" },
            volume: { type: "number" },
            state: { type: "string" },
            paused: { type: "boolean" },
            playing: { type: "boolean" },
          },
          required: ["rule", "rowsPerSecond", "scaleId", "scaleName",
                     "seedId", "volume", "state", "paused", "playing"],
          additionalProperties: false,
        };
        return [
          { name: "get_state", title: "Read loom state",
            description: "Reads the live state of the LOOM piece: rule " +
              "(0-255), tempo in rows/second, scale id + name, seed id, " +
              "volume, and the playback state (idle/running/paused).",
            inputSchema: none, outputSchema: stateOut,
            annotations: { readOnlyHint: true } },
          { name: "set_rule", title: "Set rule",
            description: "Sets the cellular-automaton rule (Wolfram 0-255; " +
              "presets 30, 90, 110, 184). Effective on the next scheduled " +
              "row - live, mid-flight.",
            inputSchema: { type: "object",
              properties: { rule: { type: "integer", minimum: 0,
                maximum: 255, description: "Wolfram rule number " +
                "(presets 30, 90, 110, 184)" } },
              required: ["rule"], additionalProperties: false },
            annotations: { idempotentHint: true } },
          { name: "set_tempo", title: "Set tempo",
            description: "Sets the tempo in rows per second (" +
              L.minRowsPerSecond + "-" + L.maxRowsPerSecond +
              "). Queued rows keep their audio times; the new grid starts " +
              "after the last queued row - no burst, no drift.",
            inputSchema: { type: "object",
              properties: { rowsPerSecond: { type: "number",
                minimum: L.minRowsPerSecond, maximum: L.maxRowsPerSecond,
                description: "Rows (beats) per second" } },
              required: ["rowsPerSecond"], additionalProperties: false },
            annotations: { idempotentHint: true } },
          { name: "set_scale", title: "Set scale",
            description: "Switches the scale quantization of the lanes to " +
              "a registry id.",
            inputSchema: { type: "object",
              properties: { scaleId: { type: "string", enum: scaleIds,
                description: "Registry scale id" } },
              required: ["scaleId"], additionalProperties: false },
            annotations: { idempotentHint: true } },
          { name: "reseed", title: "Reseed",
            description: "Plants a deterministic seed. seedId 0 (or " +
              "omitted) is the canonical single centered cell; any other " +
              "uint32 id derives a deterministic seed row (mid-flight the " +
              "next scheduled row becomes it).",
            inputSchema: { type: "object",
              properties: { seedId: { type: "integer", minimum: 0,
                maximum: L.maxSeedId,
                description: "Optional seed id (omitted = canonical)" } },
              additionalProperties: false } },
          { name: "set_volume", title: "Set volume",
            description: "Sets the master volume (0-1).",
            inputSchema: { type: "object",
              properties: { volume: { type: "number", minimum: L.minVolume,
                maximum: L.maxVolume, description: "Master volume 0-1" } },
              required: ["volume"], additionalProperties: false },
            annotations: { idempotentHint: true } },
          { name: "pause", title: "Pause",
            description: "Pauses the piece - suspends audio and freezes " +
              "the weave (the same transition as the page's pause " +
              "control). A no-op when not playing.",
            inputSchema: none,
            annotations: { readOnlyHint: false } },
          { name: "resume", title: "Resume",
            description: "Resumes the paused piece (audio-clock rebase, " +
              "no burst). A no-op when not paused.",
            inputSchema: none },
        ];
      }

      /* -- channel plumbing: the POST envelope (bridge transport) + the
         shared call executor (BOTH transports — the tool surface never
         knows which channel carried the invocation) ---------------------- */
      function post(msg) {
        fetch(bridge + "/bridge/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(msg),
        }).catch(() => {});  // transport hiccups are status, not errors
      }
      function dispatch(m) {
        let a = m.arguments;
        if (!a || typeof a !== "object" || Array.isArray(a)) a = {};
        const tool = Object.prototype.hasOwnProperty.call(TOOLS, m.name)
          ? TOOLS[m.name] : null;
        try {
          return tool ? { result: tool(a) }
            : { error: { code: -32602,
                         message: "Unknown tool: " + m.name } };
        } catch (err) {
          return { error: { code: -32000, message: "Tool error: " +
            (err && err.message ? err.message : String(err)) } };
        }
      }
      /* -- transport selection (V3 precedence) ------------------------------
       * ONE dispatch() registry, TWO transports. ?bridge= (explicit) forces
       * the V2 SSE+POST channel to the local Node bridge — verbatim v2
       * behavior, and it WINS over the public attach (the consent toggle
       * stays hidden on those loads). Every other http(s) load gets the
       * consent-gated public WebSocket attach — which does NOTHING until
       * the checkbox is checked (criterion ⑭: default-off = zero network
       * attempts, not even a probe). */
      if (bridgeForced) {
        /* TRANSPORT 1 — local bridge (V2, unchanged) */
        chan = "bridge";
        setStatus("MCP: connecting");
        const es = new EventSource(bridge + "/bridge");
        es.onopen = () => {
          setStatus("MCP: active");
          post({ type: "hello", tools: manifest() });
        };
        es.addEventListener("call", (e) => {
          let m = null;
          try { m = JSON.parse(e.data); } catch (err) { return; }
          if (!m || m.type !== "call") return;
          post(Object.assign({ id: m.id }, dispatch(m)));
        });
        es.onerror = () => {         // native auto-reconnect carries on
          setStatus("MCP: inactive (no bridge)");
        };
      } else {
        /* TRANSPORT 2 — the public attach (V3): consent-gated same-origin
         * WebSocket to the DO, hand-rolled reconnect (EventSource's free
         * auto-reconnect is gone by design — deploys drop every socket,
         * and only deliberate backoff belongs here). */
        const url = wsUrlFor(location.search, location);
        let ws = null;               // live socket (null = none)
        let step = 0;                // backoff step (reset on open)
        let superseded = false;      // {type:"detached"} received — honored
        let userClosed = false;      // toggle-off detach in progress
        let retryTimer = 0, pingTimer = 0;
        const setChan = (s, text) => { chan = s; setStatus(text); };

        function teardown() {        // stop everything socket-bound
          clearInterval(pingTimer);
          pingTimer = 0;
          if (ws) {
            const s = ws;
            ws = null;
            try { s.close(1000, "consent withdrawn"); } catch (err) {}
          }
        }
        function scheduleRetry() {
          if (!optIn || superseded) return;
          setChan("reconnecting", "MCP: reconnecting");
          clearTimeout(retryTimer);
          retryTimer = setTimeout(attach, backoffMs(step++));
        }
        function attach() {
          if (!optIn || superseded || ws) return;
          userClosed = false;
          attachAttempts++;
          setChan("connecting", "MCP: connecting");
          let sock;
          try { sock = new WebSocket(url); }
          catch (err) { scheduleRetry(); return; }
          ws = sock;
          sock.onopen = () => {
            if (ws !== sock) return; // a teardown already won the race
            step = 0;                // a successful open resets the backoff
            setChan("attached", "MCP: attached");
            /* the consent hello — the DO registers NOTHING before this
               (optIn must be exactly true; the manifest rides along so
               the page stays the source of truth for the tool surface) */
            try {
              sock.send(JSON.stringify(
                { type: "hello", tools: manifest(), optIn: true }));
            } catch (err) { /* status-only, per the file-wide rule */ }
            /* by the wire contract a new hello always takes the one-driver
               slot — from here until a detached notice or a close says
               otherwise, this tab IS the driver */
            setChan("driver-active", "MCP: driver-active");
            pingTimer = setInterval(() => {
              try {
                if (sock.readyState === 1) sock.send("loom-ping");
              } catch (err) {}
            }, KEEPALIVE_MS);
          };
          sock.onmessage = (e) => {
            if (e.data === "loom-pong") return;  // keepalive auto-answer
            let m = null;
            try { m = JSON.parse(e.data); } catch (err) { return; }
            if (!m || typeof m !== "object") return;
            if (m.type === "call") {
              try {
                if (sock.readyState === 1) sock.send(JSON.stringify(
                  Object.assign({ type: "result", id: m.id }, dispatch(m))));
              } catch (err) {}
            } else if (m.type === "detached") {
              /* one-driver takeover: another opted-in tab hello'd. HONOR it
                 — no auto-reconnect (two reconnecting tabs would ping-pong
                 the slot forever). Cycling the toggle off/on is the
                 explicit, user-driven way to retake it. */
              superseded = true;
              teardown();
              setChan("superseded", "MCP: superseded (another tab)");
            }
          };
          sock.onerror = () => {};   // a close always follows; status-only
          sock.onclose = () => {
            clearInterval(pingTimer);
            pingTimer = 0;
            if (ws === sock) ws = null;
            if (!optIn || userClosed || superseded) return;
            scheduleRetry();         // transient drop — bounded backoff
          };
        }

        /* boot: consent OFF, zero attempts; the checkbox is the only arm */
        if (consentGroup) consentGroup.hidden = false;
        setChan("off", "MCP: off");
        if (consentEl) consentEl.addEventListener("change", () => {
          optIn = consentEl.checked;
          if (optIn) {
            superseded = false;      // re-consent may retake the slot
            step = 0;
            attach();
          } else {                   // clean detach: close, stop, done
            userClosed = true;
            clearTimeout(retryTimer);
            teardown();
            setChan("off", "MCP: off");
          }
        });
      }
      if (String(location.search).indexOf("selftest") !== -1) v3SelfTest();

      /* -- WebMCP bonus: the same tools for in-browser agents ---------------- */
      if (navigator.modelContext &&
          typeof navigator.modelContext.registerTool === "function") {
        for (const t of manifest()) {
          try {
            navigator.modelContext.registerTool({
              name: t.name,
              description: t.description,
              inputSchema: t.inputSchema,
              execute: (args) => Promise.resolve(
                (Object.prototype.hasOwnProperty.call(TOOLS, t.name)
                  ? TOOLS[t.name]
                  : () => invalid("Unknown tool: " + t.name))(
                    args && typeof args === "object" ? args : {})),
            });
          } catch (err) { /* best-effort: a draft API, never load-bearing */ }
        }
      }

      return {
        active: true,
        get bridge() { return bridge; },
        status: () => (statusEl ? statusEl.textContent : ""),
        manifest: manifest,
        call: (name, args) => dispatch({ name: name, arguments: args }),
        /* V3 observability (harness + ?selftest) — NOT a control surface:
           the checkbox is the only consent writer; nothing here can arm
           the channel. channel: off / connecting / attached / driver-active
           / reconnecting / superseded (public transport) or "bridge". */
        get channel() { return chan; },
        get optIn() { return optIn; },
        get attempts() { return attachAttempts; },
        attachUrl: wsUrlFor,
        backoffMs: backoffMs,
      };
    })();

    /* Load-time note: section [2] boots the CA to its seeded state (and,
       with ?selftest in the URL, runs its acceptance harness — plus [3]'s
       scheduler harness — to the console); section [6] boots the shell to
       `idle` — title card up, listeners armed, zero timers running.
       Section [5] boots the renderer at load: DPR-correct canvas layout,
       its rAF loop running in every state (idle draws the seed row at the
       top), and — with ?fps — the debug readout. Section [3]'s scheduler
       is also inert at load (no clock, no timer, no pump); the weave
       starts only at the Begin gesture, where the shell calls
       Synth.unlock() (the audio-unlock context) and Scheduler.start() —
       from then on the lookahead timer advances the CA against
       accumulated audio-clock row times and the rAF consumption pump
       fires onTick / renderer ticks / pulses at each row's scheduled
       moment — since T-AVBIND, the renderer tick carries the fired
       rowIndex (the renderer's sole scroll-release feed) and pulses
       bloom only the lit columns of lanes the synth admitted, anchored
       to that row. Section [4] boots inert (no context, no graph — nothing
       sounds before Begin); on the gesture, Synth.unlock() arms the
       audio, the scheduler binds its clock, and Synth.scheduleRow turns
       every scheduled row's rising edges into scale-quantized glassy
       plucks through the shared graph (convolver reverb from a
       runtime-synthesized IR; feedback-delay fallback one constant away).
       Since T-A11Y the same gesture hands focus to the pause control,
       announces "Playing" to the #sr-live polite region, and — when the
       OS asks for reduced motion (matchMedia wired at init) — freezes
       the tapestry still via Renderer.setReducedMotion while the audio
       plays on. Since V2-ENGINE, section [7] boots the LOOM CONFIG
       contract at the v1 defaults (rule 30, 2.5 rows/s, A minor
       pentatonic, seed 0, volume 0.7) and applies nothing until a
       consumer — v2 controls, URL hash, MCP tools — calls
       Loom.applyConfig / applyRule / applyTempo / applyScale / reseed
       / setVolume. Every change lands LIVE: the rule on the next
       scheduled row (the byte lookup reads a runtime parameter); the
       tempo through Scheduler.setTempo's rebase (queued rows keep
       their audio times — their notes were already spawned — and the
       new grid starts one NEW interval after the last queued row: no
       burst, no drift; the renderer's scroll law tracks
       Scheduler.rowsPerSecond so the tapestry keeps pace); the scale
       through an in-place SCALE swap (all readers see it) plus a live
       readout refresh via Shell.refreshReadout; the seed through
       CA.setSeed — at the anchor row 0 is re-planted, mid-flight the
       next scheduled row becomes the derived seed row (rowIndex never
       rewinds, so grid, ring, scroll and pulses stay coherent);
       volume through Synth.setVolume. With nothing applied, the
       default state is bit-identical v1. Since V2-CTL the chrome
       carries the configuration surface: the pill's mixer toggle opens
       a panel above it (rule number input + preset chips, tempo
       slider, scale picker, Reseed, Reset) whose every write goes
       through the Loom contract above — tempo commits on release (one
       applyTempo per drag, no rebase thrash), rule/scale commit on
       change, Reseed plants a fresh random-but-encodable seed id (the
       file's single Math.random call — a user-initiated config
       choice, once per click), Reset restores the canonical defaults
       (rule 30, default tempo/scale, centered seed — volume stands) —
       and whose controls resync from Loom.getState() on every chrome
       reveal, so hash/MCP writes are reflected. The readout now tells
       the whole live truth — rule · scale · tempo — and subscribes to
       the [7] onChange notifier (armed past the parse task), so every
       successful mutator, external tempo-only writes included,
       refreshes it within one notification cycle. Since V2-STATE the
       same contract travels through the URL hash (section [8],
       namespace LoomState): a load with a hash applies it through
       Loom.applyConfig before the first rendered frame (synchronous
       script execution — no painted frame exists yet, so the hashed
       rule/seed is what frame one draws; the shell stays idle at the
       title card, running state is not hash state), every successful
       Loom mutator fires the [7] onChange seam whose subscription
       rewrites the hash with history.replaceState — rAF-coalesced for
       drags, exact at rest, never a history entry, skipped when
       already canonical — and the volume slider now routes through
       Loom.setVolume so its writes reach the hash like every other
       config change. The panel's Copy link button copies the absolute
       URL carrying the canonical hash (navigator.clipboard, falling
       back to execCommand, falling back to a selected visible input —
       file:// included); no-hash loads boot the canonical v1 default
       and the default state encodes as no hash at all.
       Since V2-MCP, section [9] (namespace LoomMCP) opens the piece
       to external MCP clients — but ONLY on http(s) origins: on
       file:// the section returns at its activation guard before any
       EventSource, fetch or navigator.modelContext probe exists
       (inert by construction; the lean-back piece is untouched). On
       an http(s) origin the section subscribes to the optional
       companion bridge (loom-bridge.mjs — EventSource GET /bridge,
       envelope POSTs to /bridge/result; same origin by default,
       ?bridge= override) and pushes its eight-tool manifest, schemas
       generated from the live Loom contract. External clients speak
       MCP to the bridge's POST /mcp (dual-era Streamable HTTP);
       tools/call events arrive over SSE, dispatch to the registry —
       thin Loom-contract calls (applyRule/applyTempo/applyScale/
       reseed/setVolume/getState) plus the shell's own pause
       transition — and every result returns through the envelope as
       the new state snapshot. Hash updates ride the [7] onChange seam
       for free. The bridge keeps one page attachment at a time (a
       new attach replaces the previous — last write wins), and the
       config panel's #mcp-status line reports the channel (active /
       inactive (no bridge) / dormant (file://)). Where the W3C
       WebMCP draft exists, navigator.modelContext registers the same
       tools for in-browser agents.
       Since V3-PAGE the default http(s) path is the PUBLIC attach,
       and it is consent-gated end to end: without ?bridge= the
       section arms nothing at boot — no EventSource probe, no
       WebSocket — until the panel's "Allow remote control"
       checkbox (default off, session-only DOM state, no storage
       API) is checked. Opting in opens the same-origin WebSocket
       (/attach on the v3 Durable Object; ?attach=<ws url> is the
       documented dev override), sends the consent hello
       {type:"hello", tools, optIn:true} — the DO registers nothing
       before it — and from then on {type:"call"} invocations
       dispatch through the SAME registry the bridge used, each
       result returning over the socket as {type:"result",
       id, result|error}. A drop reconnects with bounded
       exponential backoff + full jitter (crypto-sourced — the
       file's single Math.random stays the Reseed pick) while
       opted-in; a {type:"detached"} takeover notice is honored
       with no auto-reconnect (two opted-in tabs would otherwise
       ping-pong the one-driver slot — cycling the toggle is the
       explicit retake); "loom-ping" keepalives ride the DO's
       runtime auto-answer. Toggling off mid-session closes the
       socket cleanly, clears every timer, and makes zero further
       attempts. The status line walks the states truthfully:
       off → connecting → attached → driver-active, reconnecting
       under backoff, superseded by another tab — alongside the v2
       bridge states (connecting / active / inactive (no bridge))
       and dormant (file://). ?bridge= still WINS over the public
       attach and keeps the SSE+POST transport verbatim. */
  </script>
