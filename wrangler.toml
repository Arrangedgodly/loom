# wrangler.toml — the LOOM Worker (V3-DEPLOY restructure, 2026-08-28).
# ONE Worker (`loom`) serves everything on loom.arrangedgodly.com:
#   - the static site (index.html via Workers static assets + env.ASSETS)
#   - the public MCP endpoint (/mcp + /attach via the LoomChannel DO)
# The hostname is a WORKER CUSTOM DOMAIN bound to this Worker name (verified
# live: workers/domains loom.arrangedgodly.com -> service loom; the site was
# never on Cloudflare Pages). Deploy = ONE owner-gated `npx wrangler deploy`
# (site + DO + routing together — replaces the previous script in place; the
# custom domain keeps serving across the deploy). The standalone
# `loom-channel` worker (V3-WORKER's first-deploy shape) stays deployed on
# the account untouched — owner-decidable later; its repo config is retired
# by this rewrite.
#
# Local dev (single origin — the full same-origin stack, finally testable):
#   npx wrangler dev      # → http://localhost:8787 (index.html at / AND
#                         #   POST /mcp AND WS /attach on one origin)
name = "loom"
main = "loom-site.js"
compatibility_date = "2026-04-07"   # >= this enables WS auto close-reply; the date every V3 verification ran under (the placeholder site worker it replaces ran 2026-08-28 — irrelevant, its script is fully replaced)
workers_dev = true                  # parity with the live site worker (loom.arrangedgodly.workers.dev currently serves; that origin cannot attach or POST /mcp from a browser — Origin allowlist — set false + redeploy to retire the URL)

[assets]
directory = "."                     # repo root; .assetsignore prunes the upload to EXACTLY index.html
binding = "ASSETS"                  # env.ASSETS — loom-site.js's fallback for every non-matched path
# html_handling default (auto-trailing-slash): / serves index.html; /index.html redirects to /
# not_found_handling default (none): unknown paths 404

[[durable_objects.bindings]]
name = "LOOM_CHANNEL"
class_name = "LoomChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoomChannel"]   # SQLite backend — required on Free plan
